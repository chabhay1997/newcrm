plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'com.evtl.crm.EvtlCrmApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    //To secure the APIs and applying rate limiting using the Bucket4j
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.19.0'

    // Web APIs
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Database ORM (Laravel Eloquent ki tarah)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Auth Login Middleware
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // MySQL Database Connector
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Self-contained local development database. Production can use the
    // `mysql` Spring profile instead.
    runtimeOnly 'com.h2database:h2'

    // Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // HTML to PDF
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'

    // Excel exports
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Testing
    // Web APIs banane ke liye
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Database ORM (Laravel Eloquent ki tarah)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
 
    // For Auth Login Middleware
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // HTML-to-PDF rendering for quotation documents.
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    // QR generation for the public employee application link.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    
    // MySQL Database Connector
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

// Keep source resources on the runtime classpath
// so template edits are visible without running
// a separate Gradle command after every change.
bootRun {
    sourceResources sourceSets.main
}

test {
    useJUnitPlatform()
}
