# Tests must not compete with the file-backed development database or require MySQL.
spring.datasource.url=jdbc:h2:mem:evtlcrm-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=GLOBAL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=false
groq.base-url=http://localhost
