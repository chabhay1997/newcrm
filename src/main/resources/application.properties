server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/newcrm?useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically create/update tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Thymeleaf cache for instant UI reload
spring.thymeleaf.cache=false

# Automatically restart the application when compiled Java classes change.
spring.devtools.restart.enabled=true

# Enable browser refresh through the LiveReload browser extension.
spring.devtools.livereload.enabled=true

# Groq AI. Keep the key in the server environment, never in the browser.
# Example: GROQ_API_KEY=your-key before starting the app.
groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.transcription-model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
groq.max-completion-tokens=800
assistant.rate-limit.per-user-per-minute=10
assistant.rate-limit.global-per-minute=25

indiamart.api-key=${INDIAMART_API_KEY:}
indiamart.poll-interval-ms=${INDIAMART_POLL_INTERVAL_MS:300000}

spring.mail.protocol=smtp
spring.mail.host=smtp.office365.com
spring.mail.port=587
