server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/crmevtl?useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically create/update tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Thymeleaf cache for instant UI reload
spring.thymeleaf.cache=false

# Automatically restart the application when compiled Java classes change.
spring.devtools.restart.enabled=true

# Enable browser refresh through the LiveReload browser extension.
spring.devtools.livereload.enabled=true

# Lead Assistant. Keep the key in the server environment, never in the browser.
# Example: GROQ_API_KEY=your-key before starting the app.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
