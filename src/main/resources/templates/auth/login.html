<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — EVTL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111827;
    --slate:#6B7280;
    --border:#E2E5EA;
    --accent:#1462C4;
    --accent-dark:#0E4A96;
    --panel-bg:#CFEAF0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; color:var(--ink); }
  input:focus{ outline:none; }

  .shell{
    min-height:100vh;
    display:grid;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 860px){
    .shell{ grid-template-columns: 1fr; }
    .visual-panel{ display:none; }
  }

  /* ---- Left: form panel ---- */
  .form-panel{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
    background:#fff;
  }
  .wordmark{
    position:absolute;
    top:34px; left:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:165px;
    height:auto;
    z-index:2;
  }
  .wordmark img{
    display:block;
    width:165px;
    height:auto;
    object-fit:contain;
    background:transparent;
    filter: drop-shadow(0 2px 4px rgba(17,24,39,0.08));
  }

  .form-col{ width:100%; max-width:340px; }
  .form-heading{ text-align:center; margin-bottom:24px; }
  .form-heading h1{ font-size:19px; font-weight:700; margin:0 0 6px; }
  .form-heading p{ font-size:13.5px; color:var(--slate); margin:0; }

  .btn-google{
    width:100%; height:42px; border-radius:8px; border:1px solid var(--border);
    background:#fff; display:flex; align-items:center; justify-content:center;
    gap:9px; font-size:14px; font-weight:500; color:var(--ink); cursor:pointer;
    transition:background .15s ease, border-color .15s ease; text-decoration:none;
  }
  .btn-google:hover{ background:#F9FAFB; border-color:#C9CFD8; }

  .divider{ display:flex; align-items:center; gap:12px; margin:20px 0; }
  .divider .line{ flex:1; height:1px; background:var(--border); }
  .divider span{ font-size:12px; color:#9CA3AF; }

  .input-wrap{ position:relative; margin-bottom:12px; }
  .field-input{
    width:100%; height:42px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color:var(--ink); padding:0 14px; font-size:13.5px;
    font-family:'Inter',sans-serif; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field-input::placeholder{ color:#A3ADBA; }
  .field-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(20,98,196,0.12); }
  .username-wrap .field-input{ padding-right:92px; }
  .username-suffix{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    font-size:13px; color:#9CA3AF; pointer-events:none;
  }
  .toggle-eye{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:0; cursor:pointer; color:#9CA3AF; padding:4px;
  }
  .toggle-eye:hover{ color:var(--ink); }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin:2px 0 18px;
  }
  .remember{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--slate); }
  .remember input{ width:14px; height:14px; accent-color:var(--accent); }
  .link-muted{ font-size:13px; color:var(--accent); text-decoration:none; font-weight:500; }
  .link-muted:hover{ text-decoration:underline; }

  .btn-continue{
    width:100%; height:42px; border:0; border-radius:8px;
    background:var(--accent); color:#fff; font-weight:600; font-size:14px;
    cursor:pointer; transition:background .15s ease;
  }
  .btn-continue:hover{ background:var(--accent-dark); }

  .form-footer{
    margin-top:28px; text-align:center; font-size:12px; color:#9CA3AF;
  }

  .error-banner{
    margin-bottom:16px; border-radius:8px; background:#FEF2F2; border:1px solid #FECACA;
    color:#B91C1C; font-size:13px; padding:9px 12px;
  }

  /* ---- Right: visual panel ---- */
  .visual-panel{
    position:relative;
    background: var(--panel-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .visual-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(10,25,40,0.05) 0%, rgba(10,25,40,0.35) 100%);
    z-index:1;
  }
  .office-shot{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    animation: fadeIn 900ms ease both;
  }
  @keyframes fadeIn{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){ .office-shot{ animation:none; } }
</style>
</head>

<body>

<div class="shell">

  <!-- Form panel -->
  <div class="form-panel">
    <div class="wordmark">
      <img th:src="@{/evtl.webp}" alt="EVTL India logo" />
    </div>

    <div class="form-col">
      <div class="form-heading">
        <h1>Welcome to EVTL</h1>
        <p>Enter your credentials to access your account.</p>
      </div>

      <div th:if="${param.error}" class="error-banner">
        Invalid email or password. Please try again.
      </div>

      <a th:href="@{/oauth2/authorization/google}" class="btn-google">
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.4c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10.1 0 12s.5 3.8 1.4 5.5l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.5l4 3.1c.9-2.8 3.5-4.8 6.6-4.8z"/></svg>
        Sign in with Google
      </a>

      <div class="divider"><div class="line"></div><span>or</span><div class="line"></div></div>

      <form th:action="@{/login}" method="post">

        <div class="input-wrap username-wrap">
          <input id="username" name="username" type="text" placeholder="Enter your username" required class="field-input">
          <span class="username-suffix">@evtl.in</span>
        </div>

        <div class="input-wrap">
          <input id="password" name="password" type="password" placeholder="Password" required class="field-input" style="padding-right:40px;">
          <button type="button" class="toggle-eye" onclick="togglePwd()" aria-label="Show password">
            <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" name="remember-me">
            Remember me
          </label>
          <a th:href="@{/forgot-password}" class="link-muted">Forgot password?</a>
        </div>

        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <div class="form-footer">© 2026 EVTL India. All rights reserved.</div>
    </div>
  </div>

  <!-- Visual panel -->
  <div class="visual-panel">
    <img class="office-shot"
         src="https://images.unsplash.com/photo-1556761175-4b46a572b786?fm=jpg&q=80&w=1600&auto=format&fit=crop"
         alt="Modern office workspace">
  </div>

</div>

<script>
function togglePwd(){
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}

const loginForm = document.querySelector('form[action$="/login"]');
const loginLatitude = document.getElementById('loginLatitude');
const loginLongitude = document.getElementById('loginLongitude');
let locationRequested = false;

function captureLoginLocation(done) {
  if (!navigator.geolocation) {
    done();
    return;
  }
  navigator.geolocation.getCurrentPosition(function (position) {
    loginLatitude.value = position.coords.latitude;
    loginLongitude.value = position.coords.longitude;
    done();
  }, done, { enableHighAccuracy: true, timeout: 10000 });
}

loginForm.addEventListener('submit', function (event) {
  if (locationRequested) return;
  event.preventDefault();
  locationRequested = true;
  captureLoginLocation(function () { loginForm.submit(); });
});
</script>
</body>
</html>
