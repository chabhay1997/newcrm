<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="topbar" class="sticky top-0 z-30 pt-3 pb-4 px-8 shrink-0 bg-[#F3F6FB]">

  <div class="topbar-pill relative h-14 flex items-center justify-between px-3 gap-4">

    <div class="relative w-56 focus-within:w-80 shrink-0 ml-3 transition-[width] duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)]">

      <svg class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"
           width="13"
           height="13"
           viewBox="0 0 24 24"
           fill="none"
           stroke="#6B87A8"
           stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>

      <input
          type="text"
          placeholder="Search..."
          class="bg-white w-full h-8 pl-10 pr-3 rounded-full text-[12.5px] placeholder-[#6B87A8] text-[#17324F] focus:outline-none focus:ring-2 focus:ring-white/60">

    </div>


    <nav class="hidden md:flex items-center gap-10 absolute left-1/2 -translate-x-1/2">

      <a href="#" class="topnav-link active text-[13px] font-semibold">
        AI Chat
      </a>

      <a href="#" class="topnav-link text-[13px] font-semibold">
        Employee Chart
      </a>

      <a href="#" class="topnav-link text-[13px] font-semibold">
        Analytics
      </a>

      <a href="#" class="topnav-link text-[13px] font-semibold">
        Settings
      </a>

    </nav>


    <div class="flex items-center gap-3 shrink-0">

      <button
          type="button"
          class="w-8 h-8 rounded-full flex items-center justify-center relative bg-white hover:bg-white/90 transition">

        <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#17324F"
            stroke-width="2">

          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>

        </svg>

        <span class="absolute top-1.5 right-2 w-1.5 h-1.5 rounded-full bg-rose-500"></span>

      </button>


      <div class="relative">

        <button
            type="button"
            onclick="document.getElementById('profileMenu').classList.toggle('open')"
            class="flex items-center gap-1.5">

          <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-[12px] font-extrabold bg-gradient-to-br from-[#6D8CFF] to-[#8A5CF6]">
            <span th:text="${#strings.substring(currentUserName, 0, 1).toUpperCase()}">A</span>
          </div>

          <svg
              width="11"
              height="11"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.5">

            <path d="m6 9 6 6 6-6"/>

          </svg>

        </button>


        <div
            id="profileMenu"
            class="profile-dropdown absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-md shadow-black/10 border border-black/5 overflow-hidden z-[999]">

          <div class="px-3 py-2 border-b border-black/5">

            <p class="text-[12px] font-semibold text-[#17324F] truncate">
              <span th:text="${currentUserName}">User</span>
            </p>

            <p class="text-[10.5px] text-[#6B87A8] truncate">
              <span th:text="${currentUserEmail}">user@example.com</span>
            </p>

          </div>


          <a
              href="#"
              class="flex items-center gap-2 px-3 py-2 text-[12px] font-medium text-[#3A4B63] hover:bg-[#F3F6FB] transition">

            <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#6B87A8"
                stroke-width="2">

              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>

            </svg>

            Profile

          </a>


          <div class="h-px bg-black/5"></div>


          <!-- LOGOUT -->

          <form
              th:action="@{/logout}"
              method="post"
              style="margin: 0;">

            <button
                type="submit"
                class="flex items-center gap-2 px-3 py-2 text-[12px] font-medium text-rose-600 hover:bg-rose-50 transition w-full text-left">

              <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2">

                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <path d="M16 17l5-5-5-5"/>
                <path d="M21 12H9"/>

              </svg>

              Logout

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <style>
    #meetingReminderAlert { position: fixed; inset: 0; z-index: 2147483600; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(17, 27, 40, .58); backdrop-filter: blur(8px); }
    #meetingReminderAlert.open { display: flex; }
    #meetingReminderAlert .meeting-alert-dialog { width: min(560px, 100%); overflow: hidden; border: 1px solid #D7DFE8; border-radius: 16px; background: #fff; box-shadow: 0 28px 90px rgba(0, 0, 0, .32); animation: modalPop .22s cubic-bezier(.22, 1, .36, 1); }
    #meetingReminderAlert .meeting-alert-header { display: flex; align-items: center; gap: 14px; padding: 22px 24px; border-bottom: 1px solid #E8EDF2; background: #F7F9FB; }
    #meetingReminderAlert .meeting-alert-icon { display: flex; width: 44px; height: 44px; flex: none; align-items: center; justify-content: center; border: 1px solid #F0D5A6; border-radius: 11px; background: #FFF5E3; color: #A66C12; }
    #meetingReminderAlert .meeting-alert-eyebrow { margin: 0 0 4px; color: #A66C12; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    #meetingReminderAlert .meeting-alert-title { margin: 0; color: #1F344B; font-size: 20px; font-weight: 800; }
    #meetingReminderAlert .meeting-alert-body { display: grid; gap: 15px; padding: 22px 24px 24px; }
    #meetingReminderAlert .meeting-alert-time { margin: 0; color: #66778A; font-size: 12px; font-weight: 700; }
    #meetingReminderAlert .meeting-alert-lead { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 13px 15px; background: #F5F8FB; }
    #meetingReminderAlert .meeting-alert-lead span { min-width: 0; overflow: hidden; color: #314967; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    #meetingReminderAlert .meeting-alert-message { margin: 0; padding: 16px; border-left: 3px solid #E7A63C; background: #FFF9EF; color: #3B4653; font-size: 15px; font-weight: 650; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    #meetingReminderAlert .meeting-alert-actions { display: flex; justify-content: flex-end; }
    #meetingReminderAlert .meeting-alert-dismiss { min-height: 40px; padding: 0 18px; border: 1px solid #244F7D; border-radius: 7px; background: #244F7D; color: #fff; font-size: 12px; font-weight: 800; cursor: pointer; }
    #meetingReminderAlert .meeting-alert-dismiss:hover { background: #193F68; }
    #meetingReminderAlert .meeting-alert-dismiss:disabled { opacity: .6; cursor: wait; }

    /* ===== Meeting reminder alert v2 (3D wide) ===== */
    #meetingReminderAlert { overflow-y: auto; background: radial-gradient(ellipse at 50% 25%, rgba(31, 78, 148, .38), rgba(5, 11, 24, .82)); backdrop-filter: blur(12px) saturate(120%); -webkit-backdrop-filter: blur(12px) saturate(120%); perspective: 1700px; }
    #meetingReminderAlert .ma-stage { position: relative; width: min(940px, 100%); margin: auto; transform-style: preserve-3d; animation: maEnter .75s cubic-bezier(.2, .9, .25, 1) both; }
    @keyframes maEnter { from { opacity: 0; transform: translateY(46px) rotateX(18deg) scale(.93); } to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); } }
    #meetingReminderAlert .ma-stage::before { content: ''; position: absolute; inset: 14px 20px -14px; z-index: -1; border-radius: 28px; background: rgba(255, 255, 255, .34); }
    #meetingReminderAlert .ma-stage::after { content: ''; position: absolute; inset: 26px 40px -27px; z-index: -2; border-radius: 28px; background: rgba(255, 255, 255, .16); }

    #meetingReminderAlert .ma-card { position: relative; display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 410px; overflow: hidden; border-radius: 26px; background: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 30px 60px rgba(0, 0, 0, .38), 0 70px 120px rgba(6, 14, 32, .5); }

    #meetingReminderAlert .ma-hero { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 34px 32px; overflow: hidden; color: #fff; background: radial-gradient(circle at 18% 12%, rgba(88, 150, 255, .38), transparent 46%), radial-gradient(circle at 90% 95%, rgba(255, 200, 87, .22), transparent 42%), linear-gradient(160deg, #0A1B3A, #123668 55%, #1C4B92); }
    #meetingReminderAlert .ma-hero::before { content: ''; position: absolute; inset: 0; opacity: .5; background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px); background-size: 26px 26px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%); pointer-events: none; }
    #meetingReminderAlert .ma-hero > * { position: relative; z-index: 1; }

    #meetingReminderAlert .ma-orb-wrap { position: relative; display: flex; width: 118px; height: 118px; margin-bottom: 20px; align-items: center; justify-content: center; perspective: 500px; }
    #meetingReminderAlert .ma-ring { position: absolute; inset: 6px; border: 2px solid rgba(255, 200, 87, .55); border-radius: 36px; animation: maRing 2.6s ease-out infinite; }
    #meetingReminderAlert .ma-ring.r2 { animation-delay: 1.3s; }
    @keyframes maRing { 0% { transform: scale(.85); opacity: .85; } 100% { transform: scale(1.7); opacity: 0; } }
    #meetingReminderAlert .ma-orb { position: relative; display: flex; width: 92px; height: 92px; align-items: center; justify-content: center; border-radius: 28px; color: #3A2400; background: linear-gradient(145deg, #FFE08A, #F5A91C 60%, #D98A05); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .65), inset 0 -8px 14px rgba(160, 90, 0, .45), 0 8px 0 #A96300, 0 22px 30px rgba(0, 0, 0, .45), 0 0 50px rgba(255, 190, 70, .4); transform: rotateX(14deg) rotateY(-16deg); animation: maFloat 3.6s ease-in-out infinite; }
    #meetingReminderAlert .ma-orb svg { filter: drop-shadow(0 2px 0 rgba(255, 255, 255, .45)); transform-origin: 50% 20%; animation: maRingBell 2.4s ease-in-out infinite; }
    @keyframes maFloat { 0%, 100% { transform: translateY(0) rotateX(14deg) rotateY(-16deg); } 50% { transform: translateY(-9px) rotateX(10deg) rotateY(-9deg); } }
    @keyframes maRingBell { 0%, 55%, 100% { transform: rotate(0); } 62% { transform: rotate(14deg); } 70% { transform: rotate(-12deg); } 78% { transform: rotate(9deg); } 86% { transform: rotate(-6deg); } 93% { transform: rotate(3deg); } }

    #meetingReminderAlert .ma-eyebrow { margin: 0; color: #FFC857; font-size: 10.5px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    #meetingReminderAlert .ma-title { margin: 2px 0 0; color: #fff; font-size: 27px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
    #meetingReminderAlert .ma-time { display: grid; gap: 3px; margin-top: 18px; padding: 14px 16px; width: 100%; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .16); border-radius: 16px; background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14); backdrop-filter: blur(4px); }
    #meetingReminderAlert .ma-clock { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    #meetingReminderAlert .ma-date { color: rgba(255, 255, 255, .72); font-size: 12px; font-weight: 600; }
    #meetingReminderAlert .ma-tagline { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .7); font-size: 12px; font-style: italic; line-height: 1.5; }

    #meetingReminderAlert .ma-main { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; padding: 32px 34px 28px; background: linear-gradient(180deg, #FFFFFF, #F6F9FD); }
    #meetingReminderAlert .ma-label { margin: 0; color: #6B7A90; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    #meetingReminderAlert .ma-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
    #meetingReminderAlert .ma-info { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px 14px; border: 1px solid #E1E8F2; border-radius: 15px; background: #fff; box-shadow: 0 1px 0 #fff inset, 0 6px 14px rgba(25, 45, 80, .07), 0 2px 0 #E4EAF3; transition: transform .18s ease, box-shadow .18s ease; }
    #meetingReminderAlert .ma-info:hover { transform: translateY(-2px); box-shadow: 0 1px 0 #fff inset, 0 12px 22px rgba(25, 45, 80, .12), 0 2px 0 #E4EAF3; }
    #meetingReminderAlert .ma-ic { display: flex; width: 38px; height: 38px; flex: none; align-items: center; justify-content: center; border-radius: 11px; }
    #meetingReminderAlert .ma-ic svg { width: 18px; height: 18px; }
    #meetingReminderAlert .ma-ic-blue { background: #E1ECFF; color: #2563C9; }
    #meetingReminderAlert .ma-ic-violet { background: #EAE3FF; color: #5B3FD0; }
    #meetingReminderAlert .ma-ic-green { background: #DBF3E6; color: #17804F; }
    #meetingReminderAlert .ma-ic-amber { background: #FFEBCB; color: #B45F06; }
    #meetingReminderAlert .ma-info-body { display: grid; gap: 2px; min-width: 0; }
    #meetingReminderAlert .ma-k { color: #8493A8; font-size: 9.5px; font-weight: 800; letter-spacing: .09em; line-height: 1.2; text-transform: uppercase; }
    #meetingReminderAlert .ma-v { overflow: hidden; color: #1B2F4B; font-size: 13.5px; font-weight: 700; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }

    #meetingReminderAlert .ma-note { position: relative; padding: 18px 20px 18px 54px; border: 1px solid #F3DDB0; border-radius: 16px; background: linear-gradient(135deg, #FFFBF1, #FFF2D6); box-shadow: 0 8px 18px rgba(200, 140, 30, .14), 0 2px 0 #F0D9A6; }
    #meetingReminderAlert .ma-note::before { content: '\201C'; position: absolute; left: 16px; top: 4px; color: #E7A63C; font-family: Georgia, 'Times New Roman', serif; font-size: 56px; line-height: 1; }
    #meetingReminderAlert .ma-note p { margin: 0; color: #3B3320; font-size: 15.5px; font-weight: 650; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }

    #meetingReminderAlert .ma-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 8px; padding-top: 16px; border-top: 1px solid #E8EDF4; }
    #meetingReminderAlert .ma-hint { color: #8493A8; font-size: 11.5px; font-weight: 600; }
    #meetingReminderAlert .ma-dismiss { display: inline-flex; height: 48px; align-items: center; justify-content: center; gap: 9px; padding: 0 26px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #2A62B8, #17407F); color: #fff; font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 6px 0 #0B2551, 0 14px 22px rgba(11, 37, 81, .38); transition: transform .12s ease, box-shadow .12s ease, filter .15s ease; }
    #meetingReminderAlert .ma-dismiss:hover { filter: brightness(1.08); transform: translateY(-1px); }
    #meetingReminderAlert .ma-dismiss:active { transform: translateY(5px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 1px 0 #0B2551, 0 4px 8px rgba(11, 37, 81, .3); }
    #meetingReminderAlert .ma-dismiss:disabled { opacity: .65; cursor: wait; }

    @media (max-width: 800px) {
      #meetingReminderAlert .ma-card { grid-template-columns: 1fr; }
      #meetingReminderAlert .ma-hero { padding: 26px 24px; }
      #meetingReminderAlert .ma-main { padding: 24px 22px 22px; }
    }
    @media (max-width: 520px) {
      #meetingReminderAlert .ma-grid { grid-template-columns: 1fr; }
      #meetingReminderAlert .ma-hint { display: none; }
      #meetingReminderAlert .ma-actions { justify-content: flex-end; }
    }
    @media (prefers-reduced-motion: reduce) { #meetingReminderAlert .ma-stage, #meetingReminderAlert .ma-orb, #meetingReminderAlert .ma-orb svg, #meetingReminderAlert .ma-ring { animation: none; } }
    /* ===== End meeting reminder alert v2 ===== */
    @media (max-width: 520px) { #meetingReminderAlert { padding: 12px; } #meetingReminderAlert .meeting-alert-header { padding: 18px; } #meetingReminderAlert .meeting-alert-body { padding: 18px; } }
  </style>
  <input type="hidden" id="meetingReminderAlertCsrf" th:if="${_csrf}" th:attr="data-header=${_csrf.headerName}" th:value="${_csrf.token}">
  <div id="meetingReminderAlert" role="dialog" aria-modal="true" aria-labelledby="meetingAlertTitle">
    <div class="ma-stage">
      <div class="ma-card">

        <aside class="ma-hero">
          <span class="ma-orb-wrap" aria-hidden="true">
            <span class="ma-ring"></span><span class="ma-ring r2"></span>
            <span class="ma-orb">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.2 2.2"/><path d="M5 3 2 6M22 6l-3-3"/></svg>
            </span>
          </span>
          <p class="ma-eyebrow">Your scheduled reminder</p>
          <h2 class="ma-title" id="meetingAlertTitle">Meeting time</h2>
          <div class="ma-time">
            <span class="ma-clock" id="meetingAlertClock">--:--</span>
            <span class="ma-date" id="meetingAlertDate"></span>
          </div>
          <p class="ma-tagline">Be prepared. Be present. Make every conversation count.</p>
        </aside>

        <section class="ma-main">
          <p class="ma-label">Lead details</p>
          <div class="ma-grid">
            <div class="ma-info">
              <span class="ma-ic ma-ic-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
              <div class="ma-info-body"><span class="ma-k">Client</span><span class="ma-v" id="meetingAlertClient">-</span></div>
            </div>
            <div class="ma-info">
              <span class="ma-ic ma-ic-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2m4 0h-1M9 11h2m4 0h-1M9 15h2m4 0h-1"/></svg></span>
              <div class="ma-info-body"><span class="ma-k">Company</span><span class="ma-v" id="meetingAlertCompany">-</span></div>
            </div>
            <div class="ma-info">
              <span class="ma-ic ma-ic-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7A2 2 0 0 1 22 16.9Z"/></svg></span>
              <div class="ma-info-body"><span class="ma-k">Phone</span><span class="ma-v" id="meetingAlertPhone">-</span></div>
            </div>
            <div class="ma-info">
              <span class="ma-ic ma-ic-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
              <div class="ma-info-body"><span class="ma-k">Email</span><span class="ma-v" id="meetingAlertEmail">-</span></div>
            </div>
          </div>

          <p class="ma-label">Reminder note</p>
          <div class="ma-note"><p id="meetingAlertMessage"></p></div>

          <div class="ma-actions">
            <span class="ma-hint">This alert stays until you dismiss it.</span>
            <button type="button" class="ma-dismiss" id="meetingAlertDismiss" onclick="dismissMeetingReminderAlert()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
              Dismiss reminder
            </button>
          </div>
        </section>

      </div>
    </div>
  </div>
  <script>
    (function () {
      var activeReminder = null;
      var pollInProgress = false;

      function csrfHeaders() {
        var input = document.getElementById('meetingReminderAlertCsrf');
        var headers = {};
        if (input && input.value && input.dataset.header) headers[input.dataset.header] = input.value;
        return headers;
      }

      function showReminder(reminder) {
        activeReminder = reminder;
        var when = reminder.remindAt ? new Date(reminder.remindAt) : new Date();
        document.getElementById('meetingAlertClock').textContent = when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        document.getElementById('meetingAlertDate').textContent = reminder.remindAt
          ? when.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
          : 'Scheduled for now';
        document.getElementById('meetingAlertClient').textContent = reminder.clientName || '-';
        document.getElementById('meetingAlertCompany').textContent = reminder.companyName || '-';
        document.getElementById('meetingAlertPhone').textContent = reminder.phone || '-';
        document.getElementById('meetingAlertEmail').textContent = reminder.email || '-';
        document.getElementById('meetingAlertMessage').textContent = reminder.message || 'Meeting time - urgent reminder';
        document.getElementById('meetingAlertDismiss').disabled = false;
        document.getElementById('meetingReminderAlert').classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function hideReminder() {
        activeReminder = null;
        document.getElementById('meetingReminderAlert').classList.remove('open');
        document.body.style.overflow = '';
      }

      function pollDueReminders() {
        if (pollInProgress || activeReminder || document.visibilityState === 'hidden') return;
        pollInProgress = true;
        fetch('/leads/meeting-reminders/due', { headers: { 'Accept': 'application/json' } })
          .then(function (response) { return response.ok ? response.json() : []; })
          .then(function (reminders) {
            if (Array.isArray(reminders) && reminders.length) showReminder(reminders[0]);
          })
          .catch(function () {})
          .finally(function () { pollInProgress = false; });
      }

      window.dismissMeetingReminderAlert = function () {
        if (!activeReminder) return;
        var button = document.getElementById('meetingAlertDismiss');
        button.disabled = true;
        fetch('/leads/meeting-reminders/' + encodeURIComponent(activeReminder.id) + '/dismiss', {
          method: 'POST',
          headers: csrfHeaders()
        }).then(function (response) {
          if (!response.ok) throw new Error('Could not dismiss reminder');
          hideReminder();
          pollDueReminders();
        }).catch(function () { button.disabled = false; });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', pollDueReminders);
      } else {
        pollDueReminders();
      }
      window.setInterval(pollDueReminders, 20000);
      document.addEventListener('visibilitychange', pollDueReminders);
    })();
  </script>
</header>

</body>
</html>
