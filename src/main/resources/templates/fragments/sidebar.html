<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar" class="sidebar-dark flex flex-col">

  <div class="h-20 flex items-center gap-2.5 px-3 shrink-0">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white text-sm font-extrabold bg-gradient-to-br from-[#6D8CFF] to-[#8A5CF6] shrink-0 ml-[3px]">E</div>
    <span class="sidebar-label font-extrabold text-[15px] text-white tracking-tight">EVTL CRM</span>
  </div>

  <nav class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-3 py-4 space-y-3 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:bg-[#B8CDE8] [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-transparent">

    <div class="space-y-0.5">
      <a href="/dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="sidebar-label">Dashboard</span>
      </a>
    </div>

    <div>
      <p class="sidebar-label px-3 mb-2 text-[10.5px] font-bold uppercase tracking-wider text-white/60">Workspace</p>
      <div class="space-y-0.5">

                <a href="/leads" onclick="event.preventDefault(); document.getElementById('leadsSubmenu').classList.toggle('hidden'); document.getElementById('leadsCaret').classList.toggle('rotate-90');" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition cursor-pointer" th:classappend="${activePage == 'leads'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span class="sidebar-label flex-1">Leads</span>
          <svg id="leadsCaret" class="sidebar-label transition-transform duration-200" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </a>

        <div id="leadsSubmenu" class="hidden space-y-0.5">
          <a href="/leads" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-semibold transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="sidebar-label">All Leads</span>
          </a>
          <a href="/leads?status=1" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C7 6 4 10.5 4 14.5A8 8 0 0 0 20 14.5C20 10.5 17 6 12 2Z"/></svg>
            <span class="sidebar-label">Fresh Leads</span>
          </a>
          <a href="/leads?status=3" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5"/></svg>
            <span class="sidebar-label">Hot Leads</span>
          </a>
          <a href="/leads?status=2" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span class="sidebar-label">Follow-Ups</span>
          </a>
          <a href="/leads?status=6" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span class="sidebar-label">Missed/Pending</span>
          </a>
          <a href="/leads?status=8" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 9V5a3 3 0 0 1 6 0v4"/><rect x="4" y="9" width="16" height="11" rx="2"/></svg>
            <span class="sidebar-label">Call Not Picked</span>
          </a>
          <a href="/leads?status=7" class="sidebar-sublink flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium transition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            <span class="sidebar-label">Wrong Lead</span>
          </a>
        </div>

        <a href="/accounts" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'accounts'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h4M15 12h4M5 20h14"/></svg>
          <span class="sidebar-label">Accounts</span>
        </a>

        <a href="/vendor" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'vendor'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1"/></svg>
          <span class="sidebar-label">Vendor</span>
        </a>

        <a href="/operation" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'operation'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="sidebar-label">Operation</span>
        </a>

        <a href="/inspection" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'inspection'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="sidebar-label">Inspection</span>
        </a>

        <a href="/schedule" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'schedule'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="sidebar-label">Schedule</span>
        </a>

        <a href="/reports" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition" th:classappend="${activePage == 'reports'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          <span class="sidebar-label">Reports</span>
        </a>

      </div>
    </div>

  </nav>

  <div class="p-3 shrink-0">
    <a href="#" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-semibold transition">
      <div class="w-6 h-6 rounded-full bg-gradient-to-br from-[#6D8CFF] to-[#8A5CF6] flex items-center justify-center text-white text-[11px] font-bold shrink-0">A</div>
      <span class="sidebar-label truncate">Admin User</span>
    </a>
  </div>

</aside>

</body>
</html>
