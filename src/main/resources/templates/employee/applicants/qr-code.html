<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employee Application QR Code</title>
  <style>
    @font-face {
      font-family: Manrope;
      src: url('/fonts/Manrope-Regular.ttf')
    }

    @font-face {
      font-family: Manrope;
      src: url('/fonts/Manrope-ExtraBold.ttf');
      font-weight: 800
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Manrope, Arial;
      color: #092453
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px
    }

    .poster {
      position: relative;
      overflow: hidden;
      width: min(784px, 100%);
      min-height: 965px;
      padding: 26px 48px 48px;
      text-align: center;
      background: linear-gradient(135deg, #fff, #f5f9ff);
      border: 1px solid #e5ecf8;
      box-shadow: 0 7px 22px #12345b18
    }

    .poster:before,
    .poster:after {
      content: '';
      position: absolute;
      border-radius: 50%;
      z-index: 0
    }

    .poster:before {
      width: 270px;
      height: 270px;
      top: -155px;
      left: -110px;
      background: #e4f0ff
    }

    .poster:after {
      width: 190px;
      height: 190px;
      right: -90px;
      top: 540px;
      background: #dcf8e8
    }

    .content {
      position: relative;
      z-index: 1
    }

    .brand {
      display: block;
      width: 165px;
      height: 76px;
      object-fit: contain;
      margin: auto
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 22px;
      border-radius: 30px;
      background: #e4f0ff;
      color: #1766d8;
      font-size: 16px
    }

    .tag svg {
      width: 19px
    }

    .title {
      margin: 12px 0 9px;
      font-size: 52px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -2px
    }

    .title span {
      color: #2e6df0
    }

    .desc {
      max-width: 530px;
      margin: 0 auto 22px;
      color: #445878;
      font-size: 18px;
      line-height: 1.45
    }

    .card {
      width: 438px;
      max-width: 100%;
      margin: auto;
      padding: 24px 18px 22px;
      border: 1px solid #dce8fa;
      border-radius: 18px;
      background: #fffffff2;
      box-shadow: 0 15px 30px #2b63b728
    }

    .frame {
      position: relative;
      width: 278px;
      height: 278px;
      margin: 0 auto 22px;
      padding: 25px;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 5px 18px #1f4d9427
    }

    .frame img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated
    }

    .c {
      position: absolute;
      width: 48px;
      height: 48px;
      border: 6px solid #2d70f4
    }

    .tl {
      top: 0;
      left: 0;
      border-right: 0;
      border-bottom: 0;
      border-radius: 19px 0 0
    }

    .tr {
      top: 0;
      right: 0;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 19px 0 0
    }

    .bl {
      bottom: 0;
      left: 0;
      border-right: 0;
      border-top: 0;
      border-radius: 0 0 0 19px
    }

    .br {
      right: 0;
      bottom: 0;
      border-left: 0;
      border-top: 0;
      border-radius: 0 0 19px
    }

    .url {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 8px 7px 15px;
      border: 1px solid #cbddfc;
      border-radius: 18px;
      background: #f8fbff;
      color: #536789;
      font-size: 13px;
      text-align: left
    }

    .url span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .copy {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: #e0ecff;
      color: #3476ed;
      cursor: pointer
    }

    .copy svg,
    .print svg {
      width: 18px;
      height: 18px
    }

    .print {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(100deg, #347cf1, #2168f5);
      color: #fff;
      font: 800 15px Manrope;
      cursor: pointer
    }

    .benefits {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px;
      margin-top: 36px;
      padding: 20px 17px;
      border-radius: 20px;
      background: #eaf3ffd9
    }

    .benefit {
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left
    }

    .benefit+.benefit {
      padding-left: 24px;
      border-left: 1px solid #cadcf4
    }

    .icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #dcebff;
      color: #2173ef
    }

    .icon svg {
      width: 23px;
      height: 23px
    }

    .benefit:nth-child(2) .icon {
      background: #d8f7e5;
      color: #16b869
    }

    .benefit:nth-child(3) .icon {
      background: #ece4ff;
      color: #7444ef
    }

    .benefit b {
      display: block;
      font-size: 11px
    }

    .benefit small {
      display: block;
      margin-top: 4px;
      color: #6581b4;
      font-size: 10px;
      white-space: nowrap
    }

    @media(max-width:600px) {
      .poster {
        min-height: 100vh;
        padding: 24px 18px 35px
      }

      .title {
        font-size: 39px
      }

      .desc {
        font-size: 15px
      }

      .benefits {
        flex-direction: column;
        align-items: flex-start;
        padding-left: 34px
      }

      .benefit+.benefit {
        padding-left: 0;
        border: 0
      }
    }

    @media print {
      .page {
        padding: 0
      }

      .poster {
        width: 100%;
        border: 0;
        box-shadow: none
      }

      .copy,
      .print {
        display: none
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="poster">
      <div class="content"><img class="brand" th:src="@{/evtl.webp}" alt="EVTL India">
        <div class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <rect x="6" y="2" width="12" height="20" rx="3" />
            <path d="M10 18h4" />
          </svg>Employee Application</div>
        <h1 class="title">Scan to <span>Apply</span></h1>
        <p class="desc">Share this code with candidates to open the employee application form on their phone.</p>
        <div class="card">
          <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><img
              th:src="'data:image/png;base64,' + ${qrImage}" alt="Employee application QR code"></div>
          <div class="url"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5178b6"
              stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" />
              <path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1" />
            </svg><span id="applicationUrl" th:text="${applicationUrl}">Application URL</span><button class="copy"
              type="button" aria-label="Copy application link"
              onclick="navigator.clipboard.writeText(document.getElementById('applicationUrl').textContent.trim())"><svg
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="8" y="8" width="11" height="12" rx="2" />
                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3" />
              </svg></button></div><button class="print" type="button" onclick="window.print()"><svg viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <path d="M16 15h2v2h-2zm0 4h2v2h-2z" />
            </svg>Print QR</button>
        </div>
        <div class="benefits">
          <div class="benefit"><i class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="m13 2-8 12h6l-1 8 9-13h-6z" />
              </svg></i><span><b>Quick Access</b><small>Scan and fill form</small></span></div>
          <div class="benefit"><i class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="m12 2 8 5v5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V7z" />
                <path d="m8.5 12 2.2 2.2 4.8-5" />
              </svg></i><span><b>Secure</b><small>Safe &amp; Reliable</small></span></div>
          <div class="benefit"><i class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <rect x="7" y="2" width="10" height="20" rx="2" />
                <path d="M11 18h2" />
              </svg></i><span><b>Mobile Friendly</b><small>Works on all devices</small></span></div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
