<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Trademark | EVTL CRM</title><link rel="stylesheet" th:href="@{/css/output.css}"><link rel="stylesheet" th:href="@{/css/trademark-form.css}"><link rel="stylesheet" th:href="@{/css/trademark-form-fixes.css}"><script defer th:src="@{/js/trademark-form.js}"></script><th:block th:replace="~{fragments/styles :: layout-styles}"></th:block></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="min-h-screen flex flex-col pl-[6.5rem]"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="tm-form-page">
  <header class="tm-form-hero"><nav><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg><a href="/dashboard">Dashboard</a><b>/</b><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 10h16"/></svg><a href="/operation/trademark">Trademark List Table</a></nav><div class="tm-form-head-actions"><strong>Add Trademark</strong><a class="tm-form-back" href="/operation/trademark"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg>Back</a></div></header>
  <div th:if="${error}" class="tm-form-error" th:text="${error}"></div>
  <form id="trademarkCreateForm" class="tm-create-form" method="post" th:action="@{/operation/trademark}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <section class="tm-form-card company-card"><header><span class="section-badge blue"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4v18M12 9h8v12M8 8v2M8 13v2M8 18v2M16 13v2M16 18v2M2 21h20"/></svg></span><div><h2>Company Information</h2><p>Basic details about the applicant company</p></div><svg class="watermark" viewBox="0 0 24 24"><path d="M4 21V7l8-4v18M12 9h8v12M8 8v2M8 13v2M8 18v2M16 13v2M16 18v2M2 21h20"/></svg></header><div class="field-grid"><label><span>Company Name <i>*</i></span><div class="control"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4v18M12 9h8v12M8 8v2M8 13v2M8 18v2M16 13v2M16 18v2M2 21h20"/></svg><input name="companyName" required placeholder="Enter Company Name"></div></label><label><span>Date <i>*</i></span><div class="control"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><input name="date" type="date" required th:value="${today}"></div></label><label><span>Contact Number</span><div class="control"><svg viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1.5a15 15 0 0 0 5.5 5.5L15 14l5 2v3c0 1.1-.9 2-2 2C10.3 21 3 13.7 3 6c0-1.1.9-2 2-2Z"/></svg><input name="contactNo" placeholder="Enter Contact Number"></div></label><label><span>Email ID</span><div class="control"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input name="mailId" type="email" placeholder="Enter Email ID"></div></label></div></section>
    <section class="tm-form-card trademark-card"><header><span class="section-badge purple"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg></span><div><h2>Trademark Details</h2><p>Class, name and application information</p></div><svg class="watermark" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg></header><div class="field-grid"><label><span>Trade mark Class</span><div class="control"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><input name="tradeMarkClass" placeholder="Enter Trade mark Class"></div></label><label><span>Trade mark Name</span><div class="control"><svg viewBox="0 0 24 24"><path d="M20 13 13 20 4 11V4h7l9 9ZM8 8h.01"/></svg><input name="tradeMarkName" placeholder="Enter Trade mark Name"></div></label><label><span>Application Number</span><div class="control"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg><input name="appNo" placeholder="Enter Application Number"></div></label></div></section>
    <section class="tm-form-card status-card"><header><span class="section-badge green"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span><div><h2>Status &amp; Payment</h2><p>Current status and payment information</p></div><svg class="watermark" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6l8-3Z"/></svg></header><div class="field-grid"><label><span>Payment Status</span><div class="control"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg><select name="paymentStatus"><option value="">--select--</option><option value="1">Yes</option><option value="0">No</option></select></div></label><label><span>Mark Status</span><div class="control"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="m9 13-1 8 4-2 4 2-1-8"/></svg><select name="markStatus"><option value="">--select--</option><option>Word Mark</option><option>Logo Mark</option></select></div></label><label><span>Status</span><div class="control"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><select name="status"><option value="">--selected--</option><option>Submitted</option><option>Pending</option><option>Query</option><option>Query Reply</option><option>Granted</option></select></div></label><label><span>Validity</span><div class="control"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><input name="validity" value="5 YEAR"></div></label></div></section>
    <section class="tm-form-card additional-card"><header><span class="section-badge orange"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><h2>Additional Information</h2><p>Address and any additional remarks</p></div><svg class="watermark" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 8h8M8 12h6M14 21l5-5"/></svg></header><div class="field-grid single"><label><span>Address</span><div class="control area"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><textarea name="address" placeholder="Enter Address"></textarea></div></label><label><span>Remark</span><div class="control area"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 8h8M8 12h6M14 21l5-5"/></svg><textarea name="remark" placeholder="Enter Remark"></textarea></div></label></div></section>
  </form>
  <button class="tm-submit" type="submit" form="trademarkCreateForm"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>Submit</button>
</main></div></body></html>
