<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${editing} ? 'Edit CDSCO | EVTL CRM' : 'Add CDSCO | EVTL CRM'">Add CDSCO | EVTL CRM</title>
  <link rel="stylesheet" th:href="@{/css/output.css}">
  <link rel="stylesheet" th:href="@{/css/cdsco-form.css}">
  <link rel="stylesheet" th:href="@{/css/cdsco-form-fixes.css}">
  <th:block th:replace="~{fragments/styles :: layout-styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="min-h-screen flex flex-col pl-[6.5rem]">
  <div th:replace="~{fragments/topbar :: topbar}"></div>
  <main class="cdsco-form-page">
    <header class="cdsco-form-hero">
      <nav><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg><a href="/dashboard">Dashboard</a><b>/</b><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 10h16"/></svg><a href="/operation/cdsco">CDSCO List Table</a></nav>
      <div class="cdsco-form-head"><strong th:text="${editing} ? 'Edit CDSCO' : 'Add CDSCO'">Add CDSCO</strong><a href="/operation/cdsco"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M9 12h10"/></svg>Back</a></div>
    </header>
    <div th:if="${error}" class="cdsco-form-error" th:text="${error}"></div>
    <form id="cdscoCreateForm" class="cdsco-create-form" method="post" th:action="${editing} ? @{/operation/cdsco/{id}(id=${recordId})} : @{/operation/cdsco}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <section class="cdsco-form-card company-card">
        <header><span class="section-badge blue"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4v18M12 9h8v12M8 8v2M8 13v2M16 13v2M2 21h20"/></svg></span><div><h2>Company Information</h2><p>Company and client contact details</p></div></header>
        <div class="field-grid">
          <label><span>Company Name <i>*</i></span><div class="control"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4v18M12 9h8v12M2 21h20"/></svg><input name="companyName" required th:value="${editing ? record.companyName : ''}" placeholder="Enter Company Name"></div></label>
          <label><span>Client Name</span><div class="control"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg><input name="clientName" th:value="${editing ? record.clientName : ''}" placeholder="Enter Client Name"></div></label>
          <label><span>Mail ID</span><div class="control"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input name="mailId" type="email" th:value="${editing ? record.mailId : ''}" placeholder="Enter Mail ID"></div></label>
          <label><span>Contact Number</span><div class="control"><svg viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1.5a15 15 0 0 0 5.5 5.5L15 14l5 2v3c0 1.1-.9 2-2 2C10.3 21 3 13.7 3 6c0-1.1.9-2 2-2Z"/></svg><input name="contactNumber" th:value="${editing ? record.contactNumber : ''}" placeholder="Enter Contact Number"></div></label>
        </div>
      </section>
      <section class="cdsco-form-card access-card">
        <header><span class="section-badge purple"><svg viewBox="0 0 24 24"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4M12 15v2"/></svg></span><div><h2>Service &amp; Access</h2><p>Service and CDSCO portal credentials</p></div></header>
        <div class="field-grid single">
          <label><span>Service</span><div class="control"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5"/></svg><input name="service" th:value="${editing ? record.service : ''}" placeholder="Enter Service"></div></label>
          <label><span>User ID</span><div class="control"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg><input name="userId" th:value="${editing ? record.userId : ''}" placeholder="Enter User ID"></div></label>
          <label><span>Password</span><div class="control"><svg viewBox="0 0 24 24"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg><input name="password" type="password" autocomplete="new-password" th:placeholder="${editing} ? 'Leave blank to keep current password' : 'Enter Password'"></div></label>
        </div>
      </section>
      <section class="cdsco-form-card status-card">
        <header><span class="section-badge green"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span><div><h2>Status &amp; Payment</h2><p>Current project and payment information</p></div></header>
        <div class="field-grid">
          <label><span>Project Status</span><div class="control"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><input name="projectStatus" th:value="${editing ? record.projectStatus : ''}" placeholder="Enter Project Status"></div></label>
          <label><span>Payment Status</span><div class="control"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg><select name="paymentStatus"><option value="">--Select--</option><option th:selected="${editing and record.paymentStatus == '100% Received'}">100% Received</option><option th:selected="${editing and record.paymentStatus == 'Half'}">Half</option><option th:selected="${editing and record.paymentStatus == 'Pending'}">Pending</option><option th:selected="${editing and record.paymentStatus == 'No'}">No</option></select></div></label>
        </div>
      </section>
    </form>
    <button class="cdsco-submit" type="submit" form="cdscoCreateForm"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg><span th:text="${editing} ? 'Update CDSCO' : 'Submit'">Submit</span></button>
  </main>
</div>
</body>
</html>
