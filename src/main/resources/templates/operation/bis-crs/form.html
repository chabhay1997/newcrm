<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${editing ? 'Edit BIS-CRS Renewal | EVTL CRM' : 'Add BIS-CRS Renewal | EVTL CRM'}">Add BIS-CRS Renewal | EVTL CRM</title>
  <link rel="stylesheet" th:href="@{/css/bis-crs-form.css}">
</head>
<body>
<main class="crs-entry-page">
  <header class="crs-entry-header">
    <div class="crs-breadcrumb"><a href="/dashboard"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Dashboard</a><span>/</span><a href="/operation/bis-crs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Bis-CRS Renewal List Table</a></div>
    <div class="crs-entry-header-actions"><a class="crs-entry-back" th:href="@{/operation/bis-crs}"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></svg>Back</a><h1 th:text="${editing ? 'Edit Bis-CRS Renewal' : 'Add Bis-CRS Renewal'}">Add Bis-CRS Renewal</h1></div>
  </header>
  <div class="crs-entry-content">
    <div th:if="${error}" class="entry-alert" role="alert" th:text="${error}"></div>
    <form method="post" th:action="${editing} ? @{/operation/bis-crs/{id}(id=${recordId})} : @{/operation/bis-crs}" th:object="${form}" class="crs-entry-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <section class="entry-card manufacturer-card"><h2><i><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V6l7-3 7 3v15M9 9h1M14 9h1M9 14h1M14 14h1"/></svg></i>Manufacturer &amp; Product</h2><div class="entry-grid"><label><span>Manufacturer Name <b>*</b></span><input th:field="*{manufacturerName}" required placeholder="Enter Manufacturer Name" maxlength="255"></label><label>Product Name<input th:field="*{productName}" placeholder="Enter Product Name" maxlength="255"></label></div></section>
      <section class="entry-card license-card"><h2><i><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></i>License Details</h2><div class="entry-grid"><label>License No<input th:field="*{licenceNumber}" placeholder="Enter License No" maxlength="255"></label><label>IS Standard<input th:field="*{isStandard}" placeholder="Enter IS Standard" maxlength="255"></label></div></section>
      <section class="entry-card dates-card"><h2><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3"/></svg></i>Important Dates</h2><div class="entry-grid"><label>Date of License<input th:field="*{licenceDate}" type="date"></label><label>Expire Date of License<input th:field="*{expiryDate}" type="date"></label></div></section>
      <section class="entry-card notification-card"><h2><i><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 21h4"/></svg></i>Notification</h2><div class="entry-grid one"><label><span>Notify Date <b>*</b></span><input th:field="*{notifyDate}" type="date" required></label></div></section>
      <section class="entry-card brand-card"><h2><i><svg viewBox="0 0 24 24"><path d="m20 13-7 7L3 10V3h7l10 10Z"/><circle cx="7.5" cy="7.5" r="1"/></svg></i>Brand &amp; AIR Information</h2><div class="entry-grid"><label>Brand Name<input th:field="*{brandName}" placeholder="Enter Brand Name" maxlength="255"></label><label>AIR Name<input th:field="*{airName}" placeholder="Enter AIR Name" maxlength="255"></label></div></section>
      <section class="entry-card address-card"><h2><i><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></i>AIR Address</h2><div class="entry-grid one"><label>AIR Address<textarea th:field="*{airAddress}" placeholder="Enter AIR Address"></textarea></label></div></section>
      <section class="entry-card contact-card"><h2><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></i>Contact Information</h2><div class="entry-grid"><label>AIR Email Id<input th:field="*{airEmailId}" type="email" placeholder="Enter AIR Email Id" maxlength="255"></label><label>AIR Contact No<input th:field="*{airContactNumber}" placeholder="Enter Contact No" maxlength="255"></label></div></section>
      <section class="entry-card status-card"><h2><i><svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg></i>Status</h2><div class="entry-grid one"><label>Current Status<select th:field="*{currentStatus}"><option value="Active">Active</option><option value="Differed">Differed</option><option value="Registered">Registered</option><option value="Expired">Expired</option></select></label></div></section>
      <button class="entry-submit" type="submit"><span th:text="${editing ? 'Update' : 'Submit'}">Submit</span> <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    </form>
  </div>
</main>
</body>
</html>
