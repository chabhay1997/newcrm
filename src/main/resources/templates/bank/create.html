<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Bank</title>
  <link rel="stylesheet" th:href="@{/css/output.css}">
  <th:block th:replace="~{fragments/styles :: layout-styles}"></th:block>
  <style>
    .bank-create-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(35, 50, 70, .44);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .bank-page-card {
      width: min(720px, 100%);
      max-height: calc(100vh - 36px);
      padding: 0 27px 25px;
      border: 1px solid #d7e1ef;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 24px 65px rgba(15, 30, 50, .28);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #b9c6d8 transparent;
    }
    .bank-page-card::-webkit-scrollbar { width: 6px; }
    .bank-page-card::-webkit-scrollbar-thumb { border-radius: 999px; background: #b9c6d8; }
    .bank-page-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 0 17px;
      border-bottom: 1px solid #d7e1ef;
      background: #fff;
    }
    .bank-page-heading { display: flex; align-items: center; min-width: 0; gap: 15px; }
    .bank-page-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border-radius: 50%;
      color: #2864e8;
      background: linear-gradient(145deg, #eaf3ff, #dceaff);
    }
    .bank-page-title { margin: 0; color: #172033; font-size: 22px; font-weight: 800; line-height: 1.2; }
    .bank-page-subtitle { margin: 4px 0 0; color: #71819a; font-size: 12.5px; font-weight: 500; }
    .bank-page-actions { display: flex; align-items: center; flex-shrink: 0; gap: 12px; }
    .bank-save-button,
    .bank-close-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 45px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, filter .15s ease;
    }
    .bank-save-button {
      min-width: 88px;
      border: 0;
      color: #fff;
      background: linear-gradient(145deg, #3b7afa, #2859d9);
      box-shadow: 0 12px 26px rgba(47, 107, 234, .22);
    }
    .bank-close-button {
      width: 45px;
      border: 1px solid #d5dfed;
      color: #172033;
      background: #f8fbff;
      font-size: 24px;
      line-height: 1;
      text-decoration: none;
    }
    .bank-save-button:hover, .bank-close-button:hover { filter: brightness(.97); }
    .bank-save-button:active, .bank-close-button:active { transform: scale(.97); }
    .bank-form { padding-top: 20px; }
    .bank-field { margin-bottom: 16px; }
    .bank-field:last-child { margin-bottom: 0; }
    .bank-field label {
      display: block;
      margin-bottom: 7px;
      color: #35445b;
      font-size: 12.5px;
      font-weight: 800;
    }
    .bank-input {
      display: block;
      width: 100%;
      min-height: 47px;
      padding: 10px 14px;
      border: 1px solid #cddbeb;
      border-radius: 10px;
      outline: none;
      background: #fbfdff;
      color: #172033;
      font-size: 14px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    textarea.bank-input { min-height: 72px; resize: vertical; }
    .bank-input::placeholder { color: #94a3b8; }
    select.bank-input { cursor: pointer; }
    .bank-custom-select { position: relative; }
    .bank-select-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      text-align: left;
    }
    .bank-select-button svg { flex-shrink: 0; transition: transform .16s ease; }
    .bank-custom-select.open .bank-select-button {
      border-color: #4d77ee;
      box-shadow: 0 0 0 3px rgba(77, 119, 238, .14);
      background: #fff;
    }
    .bank-custom-select.open .bank-select-button svg { transform: rotate(180deg); }
    .bank-select-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      z-index: 30;
      max-height: 245px;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid #cddbeb;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 16px 34px rgba(23, 50, 79, .18);
      scrollbar-width: thin;
      scrollbar-color: #9aa8ba transparent;
    }
    .bank-custom-select.open .bank-select-menu { display: block; }
    .bank-select-option {
      display: block;
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 7px;
      background: #fff;
      color: #172033;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }
    .bank-select-option:hover,
    .bank-select-option.selected { color: #fff; background: #2868d5; }
    .bank-input:focus {
      border-color: #4d77ee;
      box-shadow: 0 0 0 3px rgba(77, 119, 238, .14);
      background: #fff;
    }
    .bank-message {
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .bank-message.success { border: 1px solid #a7e4c4; background: #ecfdf4; color: #147847; }
    .bank-message.error { border: 1px solid #fecaca; background: #fff1f2; color: #be123c; }
    @media (max-width: 640px) {
      .bank-create-overlay { padding: 8px; }
      .bank-page-card { max-height: calc(100vh - 16px); padding: 0 17px 20px; border-radius: 13px; }
      .bank-page-header { padding: 15px 0 13px; }
      .bank-page-icon { width: 44px; height: 44px; flex-basis: 44px; }
      .bank-page-title { font-size: 18px; }
      .bank-page-subtitle { display: none; }
      .bank-page-actions { gap: 9px; }
      .bank-save-button { min-width: 70px; }
      .bank-save-button, .bank-close-button { height: 40px; }
      .bank-close-button { width: 40px; }
      .bank-input { min-height: 44px; font-size: 13.5px; }
    }
  </style>
</head>
<body>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="min-h-screen flex flex-col pl-[6.5rem]">
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <main class="flex-1 px-8 pt-3 pb-8">
      <div class="bank-create-overlay">
      <section class="bank-page-card">
        <form id="bankCreateForm" class="bank-form-wrapper" th:action="${formAction}" th:object="${bank}" method="post">
          <header class="bank-page-header">
            <div class="bank-page-heading">
              <span class="bank-page-icon" aria-hidden="true">
                <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-6 9 6"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18M2 10h20"/></svg>
              </span>
              <div>
                <h1 class="bank-page-title" th:text="${pageTitle}">Add New Bank</h1>
                <p class="bank-page-subtitle" th:text="${pageSubtitle}">Enter bank details to add a new bank account.</p>
              </div>
            </div>
            <div class="bank-page-actions">
              <button type="submit" class="bank-save-button">Save</button>
              <a th:href="@{/bank}" class="bank-close-button" aria-label="Close bank form">×</a>
            </div>
          </header>

          <div th:if="${successMessage}" class="bank-message success" th:text="${successMessage}"></div>
          <div th:if="${errorMessage}" class="bank-message error" th:text="${errorMessage}"></div>

          <div class="bank-form">
            <div class="bank-field">
              <label for="bankDetails">Bank Details</label>
              <textarea id="bankDetails" class="bank-input" th:field="*{bankDetails}" maxlength="155" rows="2" placeholder="Enter bank details (optional)"></textarea>
            </div>

            <div class="bank-field">
              <label for="bankName">Bank Name</label>
              <div class="bank-custom-select" id="bankNameDropdown">
                <input type="hidden" id="bankName" th:field="*{bankName}">
                <button type="button" class="bank-input bank-select-button" id="bankNameButton"
                        aria-haspopup="listbox" aria-expanded="false">
                  <span id="bankNameLabel"
                        th:text="${bank.bankName != null ? @bankNameResolver.resolve(bank.bankName) : '- Select Bank -'}">- Select Bank -</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="bank-select-menu" id="bankNameMenu" role="listbox" aria-labelledby="bankNameButton">
                  <button type="button" class="bank-select-option" data-value="">- Select Bank -</button>
                  <button type="button" class="bank-select-option" role="option"
                          th:each="entry : ${bankNames.entrySet()}"
                          th:attr="data-value=${entry.key},aria-selected=${bank.bankName == entry.key}"
                          th:classappend="${bank.bankName == entry.key} ? ' selected' : ''"
                          th:text="${entry.value}">Bank name</button>
                </div>
              </div>
            </div>

            <div class="bank-field">
              <label for="branch">Branch</label>
              <input id="branch" type="text" class="bank-input" th:field="*{branch}" placeholder="Enter branch name">
            </div>

            <div class="bank-field">
              <label for="bankAcc">Account No.</label>
              <input id="bankAcc" type="text" class="bank-input" th:field="*{bankAcc}" maxlength="51" placeholder="Enter account number" required>
            </div>

            <div class="bank-field">
              <label for="ifscCode">IFSC Code</label>
              <input id="ifscCode" type="text" class="bank-input" th:field="*{ifscCode}" maxlength="21" placeholder="Enter IFSC code">
            </div>

            <div class="bank-field">
              <label for="accType">Account Type</label>
              <select id="accType" class="bank-input" th:field="*{accType}" required>
                <option value="">- Select Account Type -</option>
                <option value="1">Savings Account</option>
                <option value="2">Current Account</option>
                <option th:if="${bank.accType == 3}" value="3">Cash Credit Account</option>
                <option th:if="${bank.accType == 4}" value="4">Overdraft Account</option>
                <option value="5">Salary Account</option>
                <option value="6">Fixed Deposit Account</option>
                <option value="7">Recurring Deposit Account</option>
                <option value="8">NRE Account</option>
                <option value="9">NRO Account</option>
                <option value="10">FCNR Account</option>
                <option value="11">Demat Account</option>
                <option value="12">Loan Account</option>
              </select>
            </div>

            <div class="bank-field">
              <label for="micrCode">MICR Code</label>
              <input id="micrCode" type="text" class="bank-input" th:field="*{micrCode}" maxlength="21" placeholder="Enter MICR code">
            </div>

            <div class="bank-field">
              <label for="swiftCode">Swift Code</label>
              <input id="swiftCode" type="text" class="bank-input" th:field="*{swiftCode}" placeholder="Enter SWIFT code">
            </div>
          </div>
        </form>
      </section>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const dropdown = document.getElementById('bankNameDropdown');
      const button = document.getElementById('bankNameButton');
      const menu = document.getElementById('bankNameMenu');
      const input = document.getElementById('bankName');
      const label = document.getElementById('bankNameLabel');

      function closeDropdown() {
        dropdown.classList.remove('open');
        button.setAttribute('aria-expanded', 'false');
      }

      button.addEventListener('click', function () {
        const opening = !dropdown.classList.contains('open');
        dropdown.classList.toggle('open', opening);
        button.setAttribute('aria-expanded', String(opening));
        if (opening) menu.scrollTop = menu.querySelector('.selected')?.offsetTop || 0;
      });

      menu.addEventListener('click', function (event) {
        const option = event.target.closest('.bank-select-option');
        if (!option) return;
        input.value = option.dataset.value;
        label.textContent = option.textContent.trim();
        menu.querySelectorAll('.bank-select-option').forEach(item => item.classList.remove('selected'));
        option.classList.add('selected');
        closeDropdown();
        button.focus();
      });

      document.addEventListener('click', function (event) {
        if (!dropdown.contains(event.target)) closeDropdown();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && dropdown.classList.contains('open')) {
          closeDropdown();
          button.focus();
        }
      });
    });
  </script>
</body>
</html>
