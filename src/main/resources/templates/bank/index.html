<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/output.css}">
  <th:block th:replace="~{fragments/styles :: layout-styles}"></th:block>
  <style>
    .bank-dashboard-card { border: 1px solid #e1e7f0; border-radius: 18px; background: #fff; box-shadow: 0 14px 36px rgba(23,50,79,.06); overflow: hidden; }
    .bank-dashboard-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 22px; border-bottom: 1px solid #e7ebf2; }
    .bank-dashboard-title h1 { margin: 0; color: #171923; font-size: 21px; font-weight: 800; }
    .bank-dashboard-title p { margin: 4px 0 0; color: #8c8fa3; font-size: 12.5px; }
    .add-bank-button { display: inline-flex; align-items: center; gap: 8px; padding: 11px 17px; border-radius: 12px; color: #fff; background: linear-gradient(135deg,#8a5cf6,#6d8cff); box-shadow: 0 9px 20px rgba(109,140,255,.24); font-size: 13px; font-weight: 800; text-decoration: none; white-space: nowrap; }
    .bank-table-wrap { overflow-x: auto; }
    .bank-table { width: 100%; min-width: 1040px; border-collapse: collapse; text-align: left; }
    .bank-table th { padding: 13px 18px; background: #f7f8fb; color: #69758a; font-size: 10.5px; font-weight: 800; letter-spacing: .055em; text-transform: uppercase; }
    .bank-table td { padding: 16px 18px; border-top: 1px solid #edf0f5; color: #293347; font-size: 12.5px; font-weight: 600; vertical-align: middle; }
    .bank-table tbody tr:hover { background: #fafbfe; }
    .bank-name-link { color: #3568de; font-weight: 800; text-decoration: none; }
    .bank-name-link:hover { color: #234fba; text-decoration: underline; }
    .bank-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
    .bank-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .bank-status.active { color: #148452; background: #e9f9f1; }
    .bank-status.inactive { color: #9b3143; background: #fff0f2; }
    .bank-delete-button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid #fecdd3; border-radius: 9px; background: #fff4f5; color: #dc3545; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .bank-delete-button:hover { background: #ffe7ea; }
    .bank-empty { padding: 55px 20px !important; text-align: center; color: #8c8fa3 !important; font-weight: 600 !important; }
    .bank-flash { margin-bottom: 14px; padding: 12px 15px; border-radius: 11px; font-size: 12.5px; font-weight: 700; }
    .bank-flash.success { border: 1px solid #a7e4c4; background: #ecfdf4; color: #147847; }
    .bank-flash.error { border: 1px solid #fecaca; background: #fff1f2; color: #be123c; }
    @media (max-width: 640px) { .bank-dashboard-header { align-items: flex-start; padding: 17px; } .bank-dashboard-title h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="min-h-screen flex flex-col pl-[6.5rem]">
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <main class="flex-1 px-8 pt-3 pb-8">
      <div th:if="${successMessage}" class="bank-flash success" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="bank-flash error" th:text="${errorMessage}"></div>

      <section class="bank-dashboard-card">
        <header class="bank-dashboard-header">
          <div class="bank-dashboard-title">
            <h1>Bank Dashboard</h1>
            <p>Manage bank accounts used for invoices.</p>
          </div>
          <a th:href="@{/bank/create}" class="add-bank-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Bank
          </a>
        </header>

        <div class="bank-table-wrap">
          <table class="bank-table">
            <thead>
              <tr>
                <th>S No.</th>
                <th>Created By</th>
                <th>Bank Name</th>
                <th>Account No.</th>
                <th>IFSC Code</th>
                <th>Account Type</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="bank, row : ${banks}">
                <td th:text="${row.count}">1</td>
                <td th:text="${bank.createdBy}">Admin User</td>
                <td><a class="bank-name-link" th:href="@{/bank/{id}/edit(id=${bank.id})}" th:text="${bank.bankName}">HDFC Bank</a></td>
                <td th:text="${#strings.isEmpty(bank.accountNo) ? '—' : bank.accountNo}">0123456789</td>
                <td th:text="${#strings.isEmpty(bank.ifscCode) ? '—' : bank.ifscCode}">HDFC0000123</td>
                <td th:text="${bank.accountType}">Current Account</td>
                <td>
                  <span class="bank-status" th:classappend="${bank.status == 1} ? ' active' : ' inactive'"
                        th:text="${bank.status == 1} ? 'Active' : 'Inactive'">Active</span>
                </td>
                <td>
                  <form th:action="@{/bank/{id}/delete(id=${bank.id})}" method="post"
                        onsubmit="return confirm('Are you sure you want to delete this bank?');">
                    <button type="submit" class="bank-delete-button" aria-label="Delete bank">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(banks)}">
                <td colspan="8" class="bank-empty">No bank records found. Click “Add Bank” to create one.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
