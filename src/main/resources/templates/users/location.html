<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Location</title>
<link rel="stylesheet" th:href="@{/css/output.css}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<th:block th:replace="~{fragments/styles :: layout-styles}"></th:block>
<style>
    .location-panel { max-width: 560px; background: #fff; border-radius: 18px; padding: 34px; box-shadow: 0 18px 40px rgba(31, 41, 55, .12); }
    .location-button { min-height: 58px; border-radius: 8px; background: #38B4E8; color: #fff; font-size: 20px; font-weight: 700; box-shadow: 0 8px 18px rgba(56, 180, 232, .28); }
    .location-button:hover { background: #259FD3; }
    #locationMap { height: 260px; width: 100%; border-radius: 12px; overflow: hidden; margin-top: 22px; }
</style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-[#F3F6FB] px-5">
        <section class="location-panel w-full text-center">
            <h1 class="text-[23px] font-bold text-[#5B6FF0]">Live Location</h1>
            <p id="locationMessage" class="mt-3 text-[13px] leading-relaxed text-[#6B7280]">Allow location access to securely save your current location.</p>
            <div id="locationMap" aria-label="Live user location map"></div>
            <form id="locationForm" method="post" th:action="@{/users/location}" class="mt-6">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" id="latitude" name="latitude">
                <input type="hidden" id="longitude" name="longitude">
                <button type="submit" id="locationButton" class="location-button flex w-full items-center justify-center gap-2">
                    <span aria-hidden="true">&#128205;</span> Live Location
                </button>
            </form>
        </section>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:inline="javascript">
        const form = document.getElementById('locationForm');
        const message = document.getElementById('locationMessage');
        const latitude = document.getElementById('latitude');
        const longitude = document.getElementById('longitude');
        const savedLatitude = /*[[${latitude}]]*/ null;
        const savedLongitude = /*[[${longitude}]]*/ null;
        let requested = false;
        let locationMarker = null;

        const defaultCenter = [22.9734, 78.6569];
        const map = L.map('locationMap', { zoomControl: true, scrollWheelZoom: true }).setView(
            savedLatitude != null && savedLongitude != null ? [savedLatitude, savedLongitude] : defaultCenter,
            savedLatitude != null && savedLongitude != null ? 13 : 5
        );

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        if (savedLatitude != null && savedLongitude != null) {
            locationMarker = L.marker([savedLatitude, savedLongitude]).addTo(map);
            locationMarker.bindPopup('Saved live location');
            message.textContent = 'Saved live location is shown below.';
        }

        form.addEventListener('submit', function (event) {
            if (requested) return;
            event.preventDefault();
            requested = true;
            if (!navigator.geolocation) {
                message.textContent = 'Your browser does not support location access.';
                requested = false;
                return;
            }
            message.textContent = 'Requesting your location...';
            navigator.geolocation.getCurrentPosition(function (position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                latitude.value = lat;
                longitude.value = lng;

                if (locationMarker) {
                    map.removeLayer(locationMarker);
                }
                locationMarker = L.marker([lat, lng]).addTo(map);
                locationMarker.bindPopup('Live location');
                map.setView([lat, lng], 15);
                form.submit();
            }, function () {
                message.textContent = 'Location permission is required to continue.';
                requested = false;
            }, { enableHighAccuracy: true, timeout: 10000 });
        });
    </script>
</body>
</html>
