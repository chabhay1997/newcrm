<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="schemexforeign-panel" id="schemexforeignEditModal" class="modal-overlay" onclick="closeModal('schemexforeignEditModal')">
  <div class="modal-box glass rounded-2xl w-[820px] max-w-[96vw] p-6 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()"
       style="backdrop-filter: blur(20px); background: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 32px rgba(31,38,135,0.15);">

    <div class="flex items-center justify-between mb-5">
      <p class="text-[16px] font-bold text-[#171923]">Scheme-X Foreign &mdash; Quotation Details</p>
      <button onclick="closeModal('schemexforeignEditModal')" class="spin-close w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/5">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C8FA3" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <form id="schemexforeignQuotationForm" onsubmit="return false;">
      <input type="hidden" id="schemexforeignLeadIdInput">
      <div class="quotation-revision-bar"><span>Revisions</span><div id="schemexforeignRevisionButtons" class="quotation-revision-buttons"></div></div>

      <div class="grid grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Reference No</label>
          <input id="schemexforeignReferenceNoInput" type="text" readonly class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-[#F3F5F8]">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Certificate Type</label>
          <input type="text" value="Scheme-X Foreign" readonly class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-[#F3F5F8]">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Quotation Date</label>
          <input id="schemexforeignQuotationDateInput" type="date" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-white/70 focus:outline-none focus:ring-2 focus:ring-[#8A5CF6]/30 focus:border-[#8A5CF6]">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Client Name</label>
          <input id="schemexforeignClientNameInput" type="text" placeholder="Enter Client Name" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-white/70 focus:outline-none focus:ring-2 focus:ring-[#8A5CF6]/30 focus:border-[#8A5CF6]">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Product Name</label>
          <input id="schemexforeignProductNameInput" type="text" placeholder="Enter Product Name" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-white/70 focus:outline-none focus:ring-2 focus:ring-[#8A5CF6]/30 focus:border-[#8A5CF6]">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">HSN/ISI No.</label>
          <input id="schemexforeignHsnNoInput" type="text" placeholder="Enter HSN/ISI No." class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-white/70 focus:outline-none focus:ring-2 focus:ring-[#8A5CF6]/30 focus:border-[#8A5CF6]">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Lead Time</label>
          <input id="schemexforeignLeadTimeInput" type="text" placeholder="Enter Lead Time" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Consultancy Charge</label>
          <input id="schemexforeignConsulChargeInput" type="text" placeholder="Enter Consultancy Charge" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Air Ticket</label>
          <input id="schemexforeignAirTicketsInput" type="text" placeholder="Enter Air Ticket" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Advance Payment</label>
          <input id="schemexforeignAdvanceInput" type="text" placeholder="Enter Advance Payment" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Completion Scrutiny</label>
          <input id="schemexforeignCompletionInput" type="text" placeholder="Enter Completion Scrutiny" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Official Visit</label>
          <input id="schemexforeignOffVisitInput" type="text" placeholder="Enter Official Visit" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div class="col-span-2">
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">During Grant (On BIS Website)</label>
          <input id="schemexforeignDuringGrantInput" type="text" placeholder="During Grant (On BIS Website)" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
      </div>

      <div class="flex gap-2">
        <button type="button" onclick="closeModal('schemexforeignEditModal')" class="flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-[#171923] bg-white border border-black/10 hover:bg-[#F3F5F8] transition">Cancel</button>
        <button type="button" onclick="downloadSchemeXForeignQuotationPdf()" class="quotation-download-action flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-[#115D88] bg-[#EAF4FA] border border-[#B8D5E5] hover:bg-[#DDEEF7] transition">Download PDF</button>
        <button id="schemexforeignSaveRevisionButton" type="button" onclick="saveSchemeXForeignQuotation()" class="flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-white shadow-md shadow-purple-500/25" style="background-image:linear-gradient(135deg,#8A5CF6,#6D8CFF);">Save as New Revision</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
