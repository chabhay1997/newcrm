<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<script th:fragment="crs-panel-script" th:inline="none">
  let crsEditingRevisionId = null;
  const crsFields=['referenceNo','quotationDate','productName','clientName','quantity','subject','step1','step2','step3','bisAppFees','bisCustom','proTestFees','proCustom','applicationFee','testingFee','serviceFee','liaisoningFee'];
  function crsEl(name){return document.getElementById('crs'+name.charAt(0).toUpperCase()+name.slice(1)+'Input');}
  function crsSet(name,value){const el=crsEl(name);if(el)el.value=value==null?'':value;}
  function toggleCrsCustom(selectId,inputId){const select=document.getElementById(selectId),input=document.getElementById(inputId);if(!select||!input)return;input.style.display=select.value==='3'?'block':'none';if(select.value!=='3')input.value='';}
  function renderCrsRevisions(quotations,leadId,activeId){const box=document.getElementById('crsRevisionButtons');if(!box)return;box.innerHTML='';(quotations||[]).forEach(function(item,index){const b=document.createElement('button');b.type='button';b.className='quotation-revision-button'+(item.id===activeId?' active':'');b.textContent='R'+(index+1);b.onclick=function(event){event.preventDefault();event.stopPropagation();closeModal('crsEditModal');setTimeout(function(){openCrsEditPanel(leadId,'BIS CRS','',item.id);},50);};box.appendChild(b);});}
  function openCrsEditPanel(leadId,quotationType,companyName,revisionId){if((quotationType||'').toLowerCase().replace(/[^a-z0-9]/g,'')!=='biscrs')return;crsEditingRevisionId=revisionId||null;document.querySelector('#crsEditModal form').reset();document.getElementById('crsLeadIdInput').value=leadId;crsSet('referenceNo','REF-'+leadId);crsSet('quotationDate',new Date().toISOString().slice(0,10));document.getElementById('crsBisAppFeesInput').value='1';document.getElementById('crsProTestFeesInput').value='1';document.getElementById('crsCurrencyUsdInput').checked=false;document.getElementById('crsLiaisoningApplicableInput').checked=false;toggleCrsCustom('crsBisAppFeesInput','crsBisCustomInput');toggleCrsCustom('crsProTestFeesInput','crsProCustomInput');openModal('crsEditModal');fetch('/leads/'+leadId+'/crs-quotation'+(revisionId?'?revisionId='+encodeURIComponent(revisionId):'')).then(r=>r.json()).then(function(data){if(!data.success)return;const q=data.quotation||{},lead=data.lead||{};renderCrsRevisions(data.quotations,leadId,revisionId?q.id:null);if(!revisionId){crsSet('clientName',lead.isName||'');return;}crsFields.forEach(function(name){if(q[name]!=null)crsSet(name,q[name]);});if(!q.clientName)crsSet('clientName',lead.isName||'');document.getElementById('crsCurrencyUsdInput').checked=q.currencyUsd===true;document.getElementById('crsLiaisoningApplicableInput').checked=q.liaisoningFeeApplicable===true;toggleCrsCustom('crsBisAppFeesInput','crsBisCustomInput');toggleCrsCustom('crsProTestFeesInput','crsProCustomInput');});}
  function crsPayload(){const p={};crsFields.forEach(function(name){const el=crsEl(name);if(el)p[name]=el.value;});p.id=crsEditingRevisionId;p.leadId=document.getElementById('crsLeadIdInput').value;p.certificateType='BIS CRS';p.currencyUsd=document.getElementById('crsCurrencyUsdInput').checked;p.liaisoningFeeApplicable=document.getElementById('crsLiaisoningApplicableInput').checked;return p;}
  function saveCrsQuotation(){const id=document.getElementById('crsLeadIdInput').value;if(!id)return;const csrfHeader=document.querySelector('meta[name="_csrf_header"]')?.content,csrfToken=document.querySelector('meta[name="_csrf"]')?.content;fetch('/leads/'+id+'/crs-quotation',{method:'POST',headers:{'Content-Type':'application/json',...(csrfHeader&&csrfToken?{[csrfHeader]:csrfToken}:{})},body:JSON.stringify(crsPayload())}).then(r=>r.json()).then(function(data){if(!data.success){alert('Failed to save BIS CRS quotation: '+(data.message||'Unknown error'));return;}showLeadToast('BIS CRS quotation saved successfully');closeModal('crsEditModal');}).catch(function(){alert('Something went wrong while saving the BIS CRS quotation.');});}
  document.addEventListener('DOMContentLoaded',function(){document.getElementById('crsBisAppFeesInput').addEventListener('change',function(){toggleCrsCustom('crsBisAppFeesInput','crsBisCustomInput');});document.getElementById('crsProTestFeesInput').addEventListener('change',function(){toggleCrsCustom('crsProTestFeesInput','crsProCustomInput');});});
</script>
</body>
</html>
