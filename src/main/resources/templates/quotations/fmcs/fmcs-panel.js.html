<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<script th:fragment="fmcs-panel-script" th:inline="none">
  let fmcsEditingRevisionId = null;
  const fmcsFields = ['referenceNo','quotationDate','productName','clientName','companyName','processTime','contValInr','contractValue','inrStandard','applicantValue','applicantRemark','a1Inr','a1Usd','a2Inr','a2Usd','a3Inr','a3Usd','a4Inr','a4Usd','a5Inr','a5Usd','a6Inr','a6Usd','a7Inr','a7Usd','bankInr','bankUsd','totalInr','totalUsd','b1Inr','b1Usd','b2Inr','b2Usd','b3Inr','b3Usd','totalBInr','totalBUsd','grandTotalInr','grandTotalUsd','extraRows','rowOrder'];
  const fmcsDefaults = {a1Inr:'1000',a1Usd:'15',a3Inr:'42,000',a3Usd:'494',a4Inr:'10,000',a4Usd:'117',bankUsd:'70',b1Inr:'As per actual',b1Usd:'As per actual',b2Inr:'As per actual',b2Usd:'As per actual',b3Inr:'As per actual',b3Usd:'As per actual'};
  function fmcsId(name) { return 'fmcs' + name.charAt(0).toUpperCase() + name.slice(1) + 'Input'; }
  function fmcsElement(name) { return document.getElementById(fmcsId(name)) || document.getElementById('fmcs' + name.charAt(0).toUpperCase() + name.slice(1)); }
  function fmcsSet(name, value) { const el=fmcsElement(name); if(el) el.value=value == null ? '' : value; }
  function fmcsNumber(value) { const n=parseFloat(String(value || '').replace(/,/g,'')); return Number.isFinite(n) ? n : 0; }
  function fmcsCalculate() {
    const inr = 53000 + fmcsNumber(document.getElementById('fmcsA2Inr').value) * 3 * 85 + fmcsNumber(document.getElementById('fmcsA5Inr').value) + fmcsNumber(document.getElementById('fmcsA6Inr').value) + fmcsNumber(document.getElementById('fmcsA7Inr').value) + fmcsNumber(document.getElementById('fmcsBankInr').value);
    const usd = 696 + fmcsNumber(document.getElementById('fmcsA2Usd').value) + fmcsNumber(document.getElementById('fmcsA5Usd').value) + fmcsNumber(document.getElementById('fmcsA6Usd').value) + fmcsNumber(document.getElementById('fmcsA7Usd').value) + fmcsNumber(document.getElementById('fmcsBankUsd').value);
    const binr=fmcsNumber(document.getElementById('fmcsB1Inr').value)+fmcsNumber(document.getElementById('fmcsB2Inr').value)+fmcsNumber(document.getElementById('fmcsB3Inr').value), busd=fmcsNumber(document.getElementById('fmcsB1Usd').value)+fmcsNumber(document.getElementById('fmcsB2Usd').value)+fmcsNumber(document.getElementById('fmcsB3Usd').value);
    fmcsSet('totalInr',inr.toLocaleString('en-IN')); fmcsSet('totalUsd',usd.toLocaleString('en-US')); fmcsSet('totalBInr',binr.toLocaleString('en-IN')); fmcsSet('totalBUsd',busd.toLocaleString('en-US')); fmcsSet('grandTotalInr',(inr+binr).toLocaleString('en-IN')); fmcsSet('grandTotalUsd',(usd+busd).toLocaleString('en-US'));
  }
  function renderFmcsRevisions(quotations, leadId, activeId) { const box=document.getElementById('fmcsRevisionButtons'); if(!box)return; box.innerHTML=''; (quotations||[]).forEach(function(item,index){const b=document.createElement('button');b.type='button';b.className='quotation-revision-button'+(item.id===activeId?' active':'');b.textContent='R'+(index+1);b.onclick=function(event){event.preventDefault();event.stopPropagation();closeModal('fmcsEditModal');setTimeout(function(){openFmcsEditPanel(leadId,'BIS FMCS','',item.id);},50);};box.appendChild(b);}); }
  function openFmcsEditPanel(leadId, quotationType, companyName, revisionId) {
    if ((quotationType || '').trim().toLowerCase() !== 'bis fmcs') return;
    fmcsEditingRevisionId=revisionId||null; setQuotationRevisionButton('fmcsSaveRevisionButton',revisionId); document.getElementById('fmcsQuotationForm').reset(); document.getElementById('fmcsLeadIdInput').value=leadId; fmcsSet('referenceNo','REF-'+leadId); fmcsSet('quotationDate',new Date().toISOString().slice(0,10)); openModal('fmcsEditModal');
    fetch('/leads/'+leadId+'/fmcs-quotation'+(revisionId?'?revisionId='+encodeURIComponent(revisionId):'')).then(r=>r.json()).then(data=>{ if(!data.success)return; const q=data.quotation||{}, lead=data.lead||{}; renderFmcsRevisions(data.quotations,leadId,revisionId?q.id:null); if(!revisionId){fmcsSet('companyName',companyName||lead.companyName||'');fmcsCalculate();return;} fmcsFields.forEach(function(name){ if(q[name] != null) fmcsSet(name,q[name]); }); if(!q.companyName) fmcsSet('companyName',companyName||lead.companyName||''); if(!q.clientName) fmcsSet('clientName',lead.isName||''); Object.keys(fmcsDefaults).forEach(function(name){if(!q[name] && !fmcsElement(name).value)fmcsSet(name,fmcsDefaults[name]);}); fmcsCalculate(); }).catch(function(){fmcsSet('companyName',companyName||'');fmcsCalculate();});
  }
  function fmcsPayload() { const p={}; fmcsFields.forEach(function(name){const el=fmcsElement(name);if(el)p[name]=el.value;}); p.id=fmcsEditingRevisionId; p.leadId=document.getElementById('fmcsLeadIdInput').value; p.inrStandard=document.getElementById('fmcsInrStandardCheckbox').checked?'1':'0'; return p; }
  function saveFmcsQuotation() { const id=document.getElementById('fmcsLeadIdInput').value; if(!id)return; const csrfHeader=document.querySelector('meta[name="_csrf_header"]')?.content,csrfToken=document.querySelector('meta[name="_csrf"]')?.content; fetch('/leads/'+id+'/fmcs-quotation',{method:'POST',headers:{'Content-Type':'application/json',...(csrfHeader&&csrfToken?{[csrfHeader]:csrfToken}:{})},body:JSON.stringify(fmcsPayload())}).then(r=>r.json()).then(data=>{if(!data.success){alert('Failed to save BIS FMCS quotation: '+(data.message||'Unknown error'));return;}showLeadToast('BIS FMCS quotation saved successfully');closeModal('fmcsEditModal');}).catch(function(){alert('Something went wrong while saving the BIS FMCS quotation.');}); }
  document.addEventListener('DOMContentLoaded',function(){['A2Inr','A5Inr','A5Usd','A6Inr','A6Usd','A7Inr','A7Usd','BankInr','BankUsd','B1Inr','B1Usd','B2Inr','B2Usd','B3Inr','B3Usd'].forEach(function(n){const el=document.getElementById('fmcs'+n);if(el)el.addEventListener('input',function(){if(n.endsWith('Inr')&&n!=='A2Inr'){const usd=document.getElementById('fmcs'+n.replace('Inr','Usd'));if(usd)usd.value=Math.round(fmcsNumber(el.value)/85);}if(n.endsWith('Usd')&&n!=='A2Usd'){const inr=document.getElementById('fmcs'+n.replace('Usd','Inr'));if(inr)inr.value=Math.round(fmcsNumber(el.value)*85);}if(n==='A2Inr')document.getElementById('fmcsA2Usd').value=Math.round(fmcsNumber(el.value)*3);fmcsCalculate();});});fmcsCalculate();});
</script>
</body>
</html>
