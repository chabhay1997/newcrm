<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="bee-panel" id="beeEditModal" class="modal-overlay" onclick="closeModal('beeEditModal')">
    <div class="modal-box glass rounded-2xl w-[1400px] max-w-[96vw] p-5 max-h-[82vh] overflow-y-auto" onclick="event.stopPropagation()"
      style="width:min(1400px,96vw); max-width:96vw; max-height:82vh; overflow-y:auto; scrollbar-width:auto; scrollbar-color:#8A5CF6 #E8EAF0; backdrop-filter: blur(20px); background: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 32px rgba(31,38,135,0.15);">

    <style>
      #beeEditModal .modal-box::-webkit-scrollbar { width: 12px; }
      #beeEditModal .modal-box::-webkit-scrollbar-track { background: #E8EAF0; border-radius: 8px; }
      #beeEditModal .modal-box::-webkit-scrollbar-thumb { background: #8A5CF6; border: 3px solid #E8EAF0; border-radius: 8px; }
      #beeEditModal .modal-box::-webkit-scrollbar-thumb:hover { background: #6D48D8; }
    </style>

    <div class="flex items-center justify-between mb-5">
      <p class="text-[16px] font-bold text-[#171923]">BEE Certification &mdash; Quotation Details</p>
      <button onclick="closeModal('beeEditModal')" class="spin-close w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/5">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C8FA3" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <form id="beeQuotationForm" onsubmit="return false;">
      <input type="hidden" id="beeLeadIdInput">
      <div class="quotation-revision-bar"><span>Revisions</span><div id="beeRevisionButtons" class="quotation-revision-buttons"></div></div>

      <div class="grid grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Quotation No.</label>
          <input id="beeReferenceNoInput" type="text" readonly class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-[#F3F5F8]">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Certificate Type</label>
          <input type="text" value="BEE Certification" readonly class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-[#F3F5F8]">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Date</label>
          <input id="beeQuotationDateInput" type="date" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] text-[#171923] bg-white/70 focus:outline-none focus:ring-2 focus:ring-[#8A5CF6]/30 focus:border-[#8A5CF6]">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Client Name</label>
          <input id="beeClientNameInput" type="text" placeholder="Enter client name" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Product Name</label>
          <input id="beeProductNameInput" type="text" placeholder="Enter product name" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Category/Class</label>
          <input id="beeProductCategoryClassInput" type="text" placeholder="Enter category or class" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Custom Heading (Optional)</label>
          <input id="beeCertificateNameInput" type="text" placeholder="e.g. Proposal Letter for BEE Registration" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Manufacturing Location</label>
          <input id="beeManufacturingLocationInput" type="text" placeholder="Enter manufacturing location" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
        <div>
          <label class="block text-[11.5px] font-semibold text-[#3A4B63] mb-1.5">Model(s)</label>
          <input id="beeProductModelsInput" type="text" placeholder="Enter model names" class="w-full px-3 py-2.5 rounded-xl border border-black/10 text-[13px] bg-white/70">
        </div>
      </div>

      <!-- FEE STEPS -->
      <div class="flex items-center justify-between mb-2">
        <p class="text-[13px] font-bold text-[#171923]">Fees / Charges</p>
        <div class="flex gap-2">
          <button type="button" onclick="beeAddStep()" class="text-[11px] font-bold text-[#8A5CF6] px-3 py-1.5 rounded-full border border-[#8A5CF6]/30 bg-[#8A5CF6]/5 hover:bg-[#8A5CF6]/10 transition">+ Add Step</button>
        </div>
      </div>
      <div id="beeStepsContainer" class="flex flex-col gap-4 mb-4"></div>

      <div class="flex items-center justify-end gap-2 mb-6 text-[12.5px] font-bold text-[#3A4B63]">
        <span>Calculated total (INR-valued rows):</span>
        <span id="beeCalculatedTotal">₹0</span>
      </div>

      <div class="flex gap-2">
        <button type="button" onclick="closeModal('beeEditModal')" class="flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-[#171923] bg-white border border-black/10 hover:bg-[#F3F5F8] transition">Cancel</button>
        <button type="button" onclick="downloadBeeQuotationPdf()" class="quotation-download-action flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-[#115D88] bg-[#EAF4FA] border border-[#B8D5E5] hover:bg-[#DDEEF7] transition">Download PDF</button>
        <button id="beeSaveRevisionButton" type="button" onclick="saveBeeQuotation()" class="flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-white shadow-md shadow-purple-500/25" style="background-image:linear-gradient(135deg,#8A5CF6,#6D8CFF);">Save as New Revision</button>
      </div>
    </form>

    <template id="beeStepTemplate">
      <div class="bee-step-block rounded-xl border border-black/10 overflow-hidden">
        <div class="flex items-center justify-between px-3 py-2" style="background:#d9b8b5;">
          <input type="text" class="bee-step-label-input bg-transparent text-[12.5px] font-bold text-[#171923] outline-none flex-1 mr-3" placeholder="Step label, e.g. Step 1: Brand Registration">
          <div class="flex gap-2 shrink-0">
            <button type="button" onclick="beeAddFeeRow(this)" class="text-[10.5px] font-bold px-2.5 py-1 rounded-full bg-white/70 hover:bg-white transition">+ Row</button>
            <button type="button" onclick="beeRemoveStep(this)" class="bee-remove-step text-[10.5px] font-bold px-2.5 py-1 rounded-full bg-white/70 hover:bg-white transition text-[#C0304A]">Remove Step</button>
          </div>
        </div>
        <div class="bee-fee-rows flex flex-col" style="background:#cfe0ea;"></div>
      </div>
    </template>

    <template id="beeFeeRowTemplate">
      <div class="bee-fee-row grid gap-2 p-2 border-t border-black/5" style="grid-template-columns: 2fr 1.3fr 2fr auto;">
        <input type="text" class="bee-fee-type text-[12px] px-2.5 py-2 rounded-lg border border-black/10 bg-white" placeholder="Type of Fee/Charge">
        <input type="text" class="bee-fee-amount text-[12px] px-2.5 py-2 rounded-lg border border-black/10 bg-white" placeholder="Amount, e.g. 55000/- INR">
        <input type="text" class="bee-fee-remarks text-[12px] px-2.5 py-2 rounded-lg border border-black/10 bg-white" placeholder="Remarks">
        <button type="button" onclick="beeRemoveFeeRow(this)" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#C0304A] bg-[#FCE9EC] hover:bg-[#F8D2D8] transition">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </template>
  </div>
</div>

</body>
</html>
