<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cosmetics-panel" id="cosmeticsEditModal" class="modal-overlay" onclick="closeModal('cosmeticsEditModal')">
  <div class="modal-box glass cosmetics-modal-box" onclick="event.stopPropagation()" style="backdrop-filter:blur(20px);background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 32px rgba(31,38,135,.15);">
    <style>
      #cosmeticsEditModal .cosmetics-modal-box{width:1120px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:24px;border-radius:16px;color:#171923}
      #cosmeticsEditModal .cosmetics-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
      #cosmeticsEditModal .cosmetics-grid-wide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
      #cosmeticsEditModal .cosmetics-label{display:block;font-size:11.5px;font-weight:700;color:#3A4B63;margin-bottom:6px}
      #cosmeticsEditModal .cosmetics-input,#cosmeticsEditModal .cosmetics-select{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid rgba(0,0,0,.1);border-radius:12px;font-size:13px;color:#171923;background:rgba(255,255,255,.75);outline:none}
      #cosmeticsEditModal .cosmetics-input:focus,#cosmeticsEditModal .cosmetics-select:focus{border-color:#8A5CF6;box-shadow:0 0 0 3px rgba(138,92,246,.12)}
      #cosmeticsEditModal .cosmetics-section{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 9px}
      #cosmeticsEditModal .cosmetics-title{font-size:13px;font-weight:800;color:#171923;margin:0}
      #cosmeticsEditModal .cosmetics-table-wrap{overflow-x:auto;border:1px solid rgba(0,0,0,.08);border-radius:12px;margin-bottom:22px}
      #cosmeticsEditModal .cosmetics-table{width:100%;min-width:820px;border-collapse:collapse;font-size:12px;color:#3A4B63}
      #cosmeticsEditModal .cosmetics-table th{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;text-align:left;font-size:11px;font-weight:800;padding:11px 12px;white-space:nowrap}
      #cosmeticsEditModal .cosmetics-table td{padding:8px 12px;border-top:1px solid rgba(0,0,0,.06);vertical-align:middle;line-height:1.35}
      #cosmeticsEditModal .cosmetics-table tbody tr:nth-child(even){background:#FAFBFE}
      #cosmeticsEditModal .cosmetics-amount{width:100%;min-width:120px;box-sizing:border-box;padding:8px 10px;border:1px solid rgba(0,0,0,.1);border-radius:9px;font-size:12px;background:rgba(255,255,255,.8)}
      #cosmeticsEditModal .cosmetics-currency{display:flex;gap:12px;margin-top:6px;font-size:11px;color:#4f46e5}
      #cosmeticsEditModal .cosmetics-currency label{display:flex;align-items:center;gap:4px;cursor:pointer}
      #cosmeticsEditModal .cosmetics-action{border:0;border-radius:8px;padding:6px 9px;background:#FFF0F0;color:#D64545;font-size:11px;cursor:pointer}
      #cosmeticsEditModal .cosmetics-add{border:0;border-radius:999px;padding:7px 12px;background:#EEF0FF;color:#5846C7;font-size:11px;font-weight:800;cursor:pointer}
      #cosmeticsEditModal .cosmetics-footer{display:flex;gap:8px;margin-top:24px}
      @media(max-width:760px){#cosmeticsEditModal .cosmetics-grid,#cosmeticsEditModal .cosmetics-grid-wide{grid-template-columns:1fr}#cosmeticsEditModal .cosmetics-modal-box{padding:18px;max-width:94vw}}
    </style>
    <div class="flex items-center justify-between mb-5"><p class="text-[16px] font-bold text-[#171923]">Cosmetics Registration &mdash; Quotation Details</p><button type="button" onclick="closeModal('cosmeticsEditModal')" class="spin-close w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/5">&#10005;</button></div>
    <form onsubmit="return false;"><input type="hidden" id="cosmeticsLeadIdInput"><div class="quotation-revision-bar"><span>Revisions</span><div id="cosmeticsRevisionButtons" class="quotation-revision-buttons"></div></div>
      <div class="cosmetics-grid"><div><label class="cosmetics-label">Quotation No.</label><input id="cosmeticsReferenceNoInput" readonly class="cosmetics-input" style="background:#F3F5F8"></div><div><label class="cosmetics-label">Certificate Type</label><input value="Cosmetics Registration" readonly class="cosmetics-input" style="background:#F3F5F8"></div><div><label class="cosmetics-label">Date</label><input id="cosmeticsQuotationDateInput" type="date" class="cosmetics-input"></div></div>
      <div class="cosmetics-grid"><div><label class="cosmetics-label">Client Name</label><input id="cosmeticsClientNameInput" placeholder="Enter client name" class="cosmetics-input"></div><div><label class="cosmetics-label">Product Name</label><input id="cosmeticsProductNameInput" placeholder="Enter product name" class="cosmetics-input"></div><div><label class="cosmetics-label">Category/Class</label><input id="cosmeticsProductCategoryClassInput" placeholder="Enter category or class" class="cosmetics-input"></div></div>
      <div class="cosmetics-grid-wide"><div><label class="cosmetics-label">Company Name</label><input id="cosmeticsCompanyNameInput" readonly class="cosmetics-input" style="background:#F3F5F8"></div><div><label class="cosmetics-label">Custom Heading (Optional)</label><input id="cosmeticsCertificateNameInput" placeholder="Example: Proposal for Cosmetics Registration" class="cosmetics-input"></div><div><label class="cosmetics-label">Manufacturing Location</label><input id="cosmeticsManufacturingLocationInput" placeholder="Enter manufacturing location" class="cosmetics-input"></div><div><label class="cosmetics-label">Model(s)</label><input id="cosmeticsProductModelsInput" placeholder="Enter model names" class="cosmetics-input"></div></div>
      <div class="cosmetics-section"><p class="cosmetics-title">Commercial Details</p><button type="button" id="cosmeticsCommercialToggle" class="cosmetics-add">COS-1/2 Docs</button></div>
      <div class="cosmetics-table-wrap"><table class="cosmetics-table"><thead><tr><th style="width:8%">S. No.</th><th>Particulars</th><th style="width:28%">Amount</th><th style="width:10%">Action</th></tr></thead><tbody>
        <tr><td>1</td><td><input id="cosmeticsCommercialAlias1Input" class="cosmetics-input" value="Cos1/2 License consultancy charges"></td><td><input id="cosmeticsCommercialValue1" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrency1" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrency1" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('commercialAlias1','commercialValue1')">Clear</button></td></tr>
        <tr><td>2</td><td><input id="cosmeticsCommercialAlias2Input" class="cosmetics-input" value="Government manufacturing Site Registration"></td><td><input id="cosmeticsCommercialValue2" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrency2" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrency2" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('commercialAlias2','commercialValue2')">Clear</button></td></tr>
        <tr><td>3</td><td><input id="cosmeticsCommercialAlias3Input" class="cosmetics-input" value="Per Variant Government Charges"></td><td><input id="cosmeticsCommercialValue3" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrency3" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrency3" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('commercialAlias3','commercialValue3')">Clear</button></td></tr>
        <tr><td>4</td><td><input id="cosmeticsCommercialAlias5Input" class="cosmetics-input" value="Per Category Government Charges"></td><td><input id="cosmeticsCommercialValue5" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrency5" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrency5" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('commercialAlias5','commercialValue5')">Clear</button></td></tr>
        <tr><td>5</td><td><input id="cosmeticsConsultancyAlias1Input" class="cosmetics-input" value="Testing Support / Coordination"></td><td><input id="cosmeticsConsultancyValue1" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrencyConsultancy1" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrencyConsultancy1" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('consultancyAlias1','consultancyValue1')">Clear</button></td></tr>
        <tr><td>6</td><td><input id="cosmeticsConsultancyAlias2Input" class="cosmetics-input" value="Audit / Inspection support (if Applicable)"></td><td><input id="cosmeticsConsultancyValue2" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrencyConsultancy2" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrencyConsultancy2" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('consultancyAlias2','consultancyValue2')">Clear</button></td></tr>
        <tr><td>7</td><td><input id="cosmeticsConsultancyAlias3Input" class="cosmetics-input" value="Other Expenses (Travel / Mise.)"></td><td><input id="cosmeticsConsultancyValue3" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrencyConsultancy3" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrencyConsultancy3" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('consultancyAlias3','consultancyValue3')">Clear</button></td></tr>
        <tr><td>8</td><td><input id="cosmeticsCommercialAlias4Input" class="cosmetics-input" value="Total cost + 18 % GST"></td><td><input id="cosmeticsCommercialValue4" class="cosmetics-amount" placeholder="Enter amount"><div class="cosmetics-currency"><label><input type="radio" name="cosmeticsCurrency4" value="INR" checked> INR</label><label><input type="radio" name="cosmeticsCurrency4" value="USD"> USD</label></div></td><td><button type="button" class="cosmetics-action" onclick="clearCosmeticsField('commercialAlias4','commercialValue4')">Clear</button></td></tr>
      </tbody></table></div>
      <div class="cosmetics-section"><p class="cosmetics-title">Timeline</p><button type="button" class="cosmetics-add" onclick="addCosmeticsTimeline()">+ Add Timeline</button></div><div class="cosmetics-table-wrap"><table class="cosmetics-table"><thead><tr><th>S. No.</th><th>Timeline</th><th>Action</th></tr></thead><tbody id="cosmeticsTimelineBody"></tbody></table></div>
      <div class="cosmetics-section"><p class="cosmetics-title">List of Required Documents</p><button type="button" id="cosmeticsDocsToggle" class="cosmetics-add">COS-1/2 Docs</button></div><div class="cosmetics-table-wrap"><table class="cosmetics-table"><thead><tr><th>S. No.</th><th>Document Name</th><th>Action</th></tr></thead><tbody id="cosmeticsDocumentsBody"></tbody></table></div>
      <div class="cosmetics-footer"><button type="button" onclick="closeModal('cosmeticsEditModal')" class="flex-1 py-2.5 rounded-full text-[12.5px] font-semibold bg-white border border-black/10">Cancel</button><button type="button" onclick="saveCosmeticsQuotation()" class="flex-1 py-2.5 rounded-full text-[12.5px] font-semibold text-white" style="background-image:linear-gradient(135deg,#8A5CF6,#6D8CFF);">Save as New Revision</button></div>
    </form>
  </div>
</div>
</body>
</html>
