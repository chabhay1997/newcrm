<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<script th:fragment="cosmetics-panel-script" th:inline="none">
  let cosmeticsEditingRevisionId = null;
  const cosmeticsMap=[['commercialAlias1','commercialValue1','commercialCurrency1'],['commercialAlias2','commercialValue2','commercialCurrency2'],['commercialAlias3','commercialValue3','commercialCurrency3'],['commercialAlias5','commercialValue5','commercialCurrency5'],['consultancyAlias1','consultancyValue1','consultancyCurrency1'],['consultancyAlias2','consultancyValue2','consultancyCurrency2'],['consultancyAlias3','consultancyValue3','consultancyCurrency3'],['commercialAlias4','commercialValue4','commercialCurrency4']];
  const cosmeticsCos12=['Cos1/2 License consultancy charges','Government manufacturing Site Registration','Per Variant Government Charges','Per Category Government Charges','Testing Support / Coordination','Audit / Inspection support (if Applicable)','Other Expenses (Travel / Mise.)','Total cost + 18 % GST'];
  const cosmeticsCos58=['Cos5/8 License consultancy charges','Government manufacturing Site Registration','Per Variant Government Charges','Per Category Government Charges','Testing Support / Coordination','Audit / Inspection support (if Applicable)','Other Expenses (Travel / Mise.)','Total cost + 18 % GST'];
  const cosmeticsDocuments=['Company Registration Certificate (GST, PAN, CIN)','List of Cosmetic Products with ingredients','Free Sale Certificate (for import cases)','ISO Certificate (if applicable)','Covering Letter','Power Of Attorney + Undertaking from Authorized Agent/Applicant','Non Animal Testing Declaration/Undertaking','Declaration for Heavy Metal and Hexachlorophene content','Label of proposed product','Authenticated copy of manufacturing licenses/registration/marketing','List of Ingredients details/Formula Statement','Specification and testing method for testing of cosmetics','Part 1 of 2nd Schedule','GST and IEC'];
  const cosmeticsManufacturingDocuments=['Site plan and layout of premises','Ownership or rental proof','List of manufacturing equipments','Details of manufacturing chemist (Qualification & Experience)','Product formula and manufacturing process details','Water analysis report','No objection certificate from local authority','Pollution control NOC','Electricity and safety details','GMP and hygienic compliance certificate','List of raw materials and suppliers','Product label and packaging sample','Company registration documents'];
  const cosmeticsTimeline=['Documentation Preparation: 1-2 Weeks','Application Submission & Processing: 2-4 Weeks','Total Expected Timeline: 20-45 Working Days'];
  const cosmeticsFields=['referenceNo','quotationDate','clientName','companyName','productName','productCategoryClass','certificateName','manufacturingLocation','productModels'].concat(cosmeticsMap.flat());
  function cosmeticsEl(name){return document.getElementById('cosmetics'+name.charAt(0).toUpperCase()+name.slice(1)+'Input')||document.getElementById('cosmetics'+name.charAt(0).toUpperCase()+name.slice(1));}
  function cosmeticsSet(name,value){const el=cosmeticsEl(name);if(el)el.value=value==null?'':value;}
  function cosmeticsRadio(name,value){const suffix=name.replace('commercialCurrency','').replace('consultancyCurrency','Consultancy');const el=document.querySelector('input[name="cosmeticsCurrency'+suffix+'"][value="'+(value||'INR')+'"]');if(el)el.checked=true;}
  function renderCosmeticsRows(items,kind){const body=document.getElementById(kind==='timeline'?'cosmeticsTimelineBody':'cosmeticsDocumentsBody');body.innerHTML='';(items&&items.length?items:[]).forEach(function(item){const tr=document.createElement('tr');tr.innerHTML='<td>'+(body.children.length+1)+'</td><td><input class="cosmetics-input '+(kind==='timeline'?'cosmetics-timeline-input':'cosmetics-document-input')+'" value=""></td><td><button type="button" class="cosmetics-action">Clear</button></td>';tr.querySelector('input').value=item;tr.querySelector('button').onclick=function(){tr.remove();};body.appendChild(tr);});}
  function addCosmeticsTimeline(){const items=Array.from(document.querySelectorAll('.cosmetics-timeline-input')).map(x=>x.value);items.push('');renderCosmeticsRows(items,'timeline');}
  function clearCosmeticsField(alias,value){cosmeticsSet(alias,'');cosmeticsSet(value,'');}
  function toggleCosmeticsLabels(){const button=document.getElementById('cosmeticsCommercialToggle'),labels=button.dataset.set==='cos58'?cosmeticsCos12:cosmeticsCos58;button.dataset.set=button.dataset.set==='cos58'?'cos12':'cos58';button.textContent=button.dataset.set==='cos58'?'COS-5/8 Docs':'COS-1/2 Docs';cosmeticsMap.forEach(function(pair,index){cosmeticsSet(pair[0],labels[index]);});}
  function toggleCosmeticsDocuments(){const button=document.getElementById('cosmeticsDocsToggle'),manufacturing=button.dataset.set!=='manufacturing';button.dataset.set=manufacturing?'manufacturing':'default';button.textContent=manufacturing?'COS-5/8 Docs':'COS-1/2 Docs';renderCosmeticsRows(manufacturing?cosmeticsManufacturingDocuments:cosmeticsDocuments,'documents');}
  function parseCosmeticsJson(value,fallback){try{const parsed=JSON.parse(value||'');return Array.isArray(parsed)?parsed:fallback;}catch(e){return fallback;}}
  function renderCosmeticsRevisions(quotations,leadId,activeId){const box=document.getElementById('cosmeticsRevisionButtons');if(!box)return;box.innerHTML='';(quotations||[]).forEach(function(item,index){const b=document.createElement('button');b.type='button';b.className='quotation-revision-button'+(item.id===activeId?' active':'');b.textContent='R'+(index+1);b.onclick=function(event){event.preventDefault();event.stopPropagation();closeModal('cosmeticsEditModal');setTimeout(function(){openCosmeticsEditPanel(leadId,'Cosmetics','',item.id);},50);};box.appendChild(b);});}
  function openCosmeticsEditPanel(leadId,quotationType,companyName,revisionId){const normalizedType=(quotationType||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(normalizedType!=='cosmetics'&&normalizedType!=='cosmeticsregistration')return;cosmeticsEditingRevisionId=revisionId||null;document.querySelector('#cosmeticsEditModal form').reset();document.getElementById('cosmeticsLeadIdInput').value=leadId;cosmeticsSet('referenceNo','REF-'+leadId);cosmeticsSet('quotationDate',new Date().toISOString().slice(0,10));cosmeticsSet('companyName',companyName||'');renderCosmeticsRows(cosmeticsTimeline,'timeline');renderCosmeticsRows(cosmeticsDocuments,'documents');openModal('cosmeticsEditModal');fetch('/leads/'+leadId+'/cosmetics-quotation'+(revisionId?'?revisionId='+encodeURIComponent(revisionId):'')).then(r=>r.json()).then(function(data){if(!data.success)return;const q=data.quotation||{},lead=data.lead||{};renderCosmeticsRevisions(data.quotations,leadId,revisionId?q.id:null);if(!revisionId){cosmeticsSet('companyName',companyName||lead.companyName||'');return;}cosmeticsFields.forEach(function(name){if(q[name]!=null)cosmeticsSet(name,q[name]);});if(!q.companyName)cosmeticsSet('companyName',companyName||lead.companyName||'');document.getElementById('cosmeticsCommercialToggle').dataset.set=q.commercialLabelSet==='COS-5/8'?'cos58':'cos12';document.getElementById('cosmeticsCommercialToggle').textContent=q.commercialLabelSet==='COS-5/8'?'COS-5/8 Docs':'COS-1/2 Docs';document.getElementById('cosmeticsDocsToggle').dataset.set=q.requiredDocuments&&q.requiredDocuments.indexOf('Site plan and layout')>=0?'manufacturing':'default';document.getElementById('cosmeticsDocsToggle').textContent=document.getElementById('cosmeticsDocsToggle').dataset.set==='manufacturing'?'COS-5/8 Docs':'COS-1/2 Docs';cosmeticsMap.forEach(function(pair){cosmeticsRadio(pair[2],q[pair[2]]);});renderCosmeticsRows(parseCosmeticsJson(q.timelineItems,cosmeticsTimeline),'timeline');renderCosmeticsRows(parseCosmeticsJson(q.requiredDocuments,cosmeticsDocuments),'documents');});}
  function cosmeticsPayload(){const p={};cosmeticsFields.forEach(function(name){const el=cosmeticsEl(name);if(el)p[name]=el.value;});p.id=cosmeticsEditingRevisionId;p.leadId=document.getElementById('cosmeticsLeadIdInput').value;p.certificateType='Cosmetics Registration';p.commercialLabelSet=document.getElementById('cosmeticsCommercialToggle').dataset.set==='cos58'?'COS-5/8':'COS-1/2';p.requiredDocuments=JSON.stringify(Array.from(document.querySelectorAll('.cosmetics-document-input')).map(x=>x.value));p.timelineItems=JSON.stringify(Array.from(document.querySelectorAll('.cosmetics-timeline-input')).map(x=>x.value));p.extraRows='[]';p.commercialRowOrder=JSON.stringify(cosmeticsMap.map(x=>x[0]));return p;}
  function saveCosmeticsQuotation(){const id=document.getElementById('cosmeticsLeadIdInput').value;if(!id)return;const csrfHeader=document.querySelector('meta[name="_csrf_header"]')?.content,csrfToken=document.querySelector('meta[name="_csrf"]')?.content;fetch('/leads/'+id+'/cosmetics-quotation',{method:'POST',headers:{'Content-Type':'application/json',...(csrfHeader&&csrfToken?{[csrfHeader]:csrfToken}:{})},body:JSON.stringify(cosmeticsPayload())}).then(r=>r.json()).then(function(data){if(!data.success){alert('Failed to save Cosmetics quotation: '+(data.message||'Unknown error'));return;}showLeadToast('Cosmetics quotation saved successfully');closeModal('cosmeticsEditModal');}).catch(function(){alert('Something went wrong while saving the Cosmetics quotation.');});}
  document.addEventListener('DOMContentLoaded',function(){renderCosmeticsRows(cosmeticsTimeline,'timeline');renderCosmeticsRows(cosmeticsDocuments,'documents');document.getElementById('cosmeticsCommercialToggle').addEventListener('click',toggleCosmeticsLabels);document.getElementById('cosmeticsDocsToggle').addEventListener('click',toggleCosmeticsDocuments);});
</script>
</body>
</html>
