<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Add Equipment Quotation | EVTL CRM</title>
  <link rel="stylesheet" th:href="@{/css/output.css}">
  <th:block th:replace="~{fragments/styles :: layout-styles}"></th:block>
  <style>
    body { margin: 0; background: #F3F6FB; }
    .equipment-quotation-create { margin: 24px 32px; padding: 0; }
    .equipment-quotation-card { overflow: hidden; border: 1px solid #E3E9F2; border-radius: 14px; background: #fff; box-shadow: 0 12px 28px -22px rgba(22, 42, 72, .42); }
    .quotation-create-header { box-sizing: border-box; display: flex; height: 56px; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 22px; color: #fff; background: linear-gradient(110deg, #19345B, #5568DF); }
    .quotation-breadcrumb { display: flex; align-items: center; gap: .6rem; font-size: 13px; font-weight: 600; }
    .quotation-breadcrumb svg { width: 18px; height: 18px; }
    .quotation-create-header h1 { margin: 0; font-size: 17px; font-weight: 800; }
    .quotation-create-form { padding: 24px; }
    .quotation-fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1rem 18px; }
    .quotation-field { display: block; min-width: 0; }
    .quotation-field-label { display: block; margin-bottom: 7px; color: #334155; font-size: 12px; font-weight: 800; letter-spacing: .01em; }
    .quotation-input { box-sizing: border-box; width: 100%; height: 42px; border: 1px solid #D8E1F0; border-radius: 8px; padding: 0 12px; color: #1E293B; background: #fff; font: inherit; font-size: 12px; outline: none; }
    .quotation-input:focus { border-color: #6375EC; box-shadow: 0 0 0 3px rgba(99, 117, 236, .14); }
    .quotation-input[readonly] { background: #EEF0F8; }
    .quotation-items-wrap { margin: 24px 0 0; overflow-x: auto; border: 1px solid #E6EBF2; border-radius: 10px; }
    .quotation-items { width: 100%; min-width: 860px; border-collapse: collapse; text-align: left; }
    .quotation-items thead { background: #F6F8FC; }
    .quotation-items th { height: 48px; box-sizing: border-box; padding: .75rem 1rem; color: #475569; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .quotation-items td { padding: .75rem 1rem; border-bottom: 1px solid #EEF1F5; }
    .quotation-item-input { box-sizing: border-box; width: 100%; height: 36px; border: 1px solid #DDE3FF; border-radius: .375rem; padding: 0 .75rem; font: inherit; font-size: 12px; outline: none; }
    .quotation-item-input:focus { border-color: #6375EC; box-shadow: 0 0 0 3px rgba(99, 117, 236, .14); }
    .quotation-row-delete { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 7px; color: #DC2626; background: #FEF2F2; cursor: pointer; }
    .quotation-row-delete:hover { background: #FEE2E2; }
    .quotation-add-row-wrap { display: flex; justify-content: flex-end; margin: 16px 0 0; }
    .quotation-add-row { display: inline-flex; align-items: center; gap: .375rem; height: 38px; border: 0; border-radius: 8px; padding: 0 14px; color: #fff; background: #16A36A; box-shadow: 0 4px 10px rgba(22, 163, 106, .18); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .quotation-add-row:hover { background: #13875A; }
    .quotation-submit { display: flex; align-items: center; justify-content: center; width: 180px; height: 42px; margin: 24px 0 0 auto; border: 0; border-radius: 8px; color: #fff; background: #4F5FD1; box-shadow: 0 4px 10px rgba(79, 95, 209, .22); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    .quotation-submit:hover { background: #4050BF; }
    .quotation-form-message { min-height: 18px; margin-top: 14px; text-align: right; color: #16A36A; font-size: 12px; font-weight: 700; }
    .quotation-form-message.error { color: #DC2626; }
    @media (max-width: 1279px) { .quotation-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 767px) { .equipment-quotation-create { margin: 12px; } .quotation-create-header { height: auto; align-items: flex-start; flex-direction: column; padding: 1rem; } .quotation-create-form { padding: 16px; } .quotation-fields { grid-template-columns: 1fr; gap: 1rem; } .quotation-submit { width: 100%; } }
  </style>
</head>
<body>
    <main class="equipment-quotation-create">
      <section class="equipment-quotation-card">
        <header class="quotation-create-header">
          <div class="quotation-breadcrumb">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="14" rx="2" />
              <path d="M8 21h8M12 17v4" />
            </svg>
            <span>Dashboard</span>
            <span class="text-white/80">/</span>
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M7 8h10M7 12h10M7 16h6" />
            </svg>
            <span>Equipment Quotation List Table</span>
          </div>
          <h1 class="text-[17px] font-extrabold">Add Equipment Quotation</h1>
        </header>

        <form id="quotationCreateForm" class="quotation-create-form">
          <div class="quotation-fields">
            <label class="quotation-field">
              <span class="quotation-field-label">Invoice No</span>
              <input id="quotationInvoiceNo" type="text" value="EVTL/TEST-EQ" readonly aria-label="Invoice No"
                class="quotation-input">
            </label>
            <label class="quotation-field">
              <span class="quotation-field-label">Date</span>
              <input id="quotationDate" type="date" th:value="${#temporals.format(quotationDate, 'yyyy-MM-dd')}" aria-label="Date"
                class="quotation-input">
            </label>
            <label class="quotation-field">
              <span class="quotation-field-label">Attention</span>
              <input id="quotationAttention" type="text" placeholder="Enter Attention" aria-label="Attention"
                class="quotation-input">
            </label>
            <label class="quotation-field">
              <span class="quotation-field-label">Client Name</span>
              <input id="quotationClientName" type="text" placeholder="Enter Client Name" aria-label="Client Name"
                class="quotation-input">
            </label>
            <label class="quotation-field">
              <span class="quotation-field-label">Company Name</span>
              <input id="quotationCompanyName" type="text" placeholder="Enter Company Name" aria-label="Company Name"
                class="quotation-input">
            </label>
            <label class="quotation-field">
              <span class="quotation-field-label">IS Code</span>
              <input id="quotationIsCode" type="text" placeholder="Enter IS code" aria-label="IS Code"
                class="quotation-input">
            </label>
          </div>

          <div class="quotation-items-wrap">
            <table class="quotation-items" aria-label="Equipment quotation line items">
              <thead>
                <tr>
                  <th>Sn No</th>
                  <th>Desc</th>
                  <th>HSN Code</th>
                  <th>Qty</th>
                  <th>Actual Price</th>
                  <th>Price</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="quotationItemRows"></tbody>
            </table>
          </div>

          <div class="quotation-add-row-wrap">
            <button id="addQuotationRow" type="button" class="quotation-add-row">
              <span class="text-[16px] leading-none">⊕</span> Add Row
            </button>
          </div>

          <button id="quotationSubmit" type="submit" class="quotation-submit">
            Submit
          </button>
          <p id="quotationFormMessage" class="quotation-form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

  <script>
    (() => {
      const rows = document.getElementById('quotationItemRows');
      const addRow = document.getElementById('addQuotationRow');
      const form = document.getElementById('quotationCreateForm');
      const submit = document.getElementById('quotationSubmit');
      const message = document.getElementById('quotationFormMessage');

      function updateRowNumbers() {
        rows.querySelectorAll('tr').forEach((row, index) => {
          row.querySelector('[data-row-number]').textContent = String(index + 1);
        });
      }

      addRow.addEventListener('click', () => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-[#EEF1F5]';
        tr.innerHTML = `
          <td data-row-number class="px-4 py-3 text-[12px] font-semibold text-[#3A4B63]"></td>
          <td><input type="text" aria-label="Description" class="quotation-item-input"></td>
          <td><input type="text" aria-label="HSN Code" class="quotation-item-input"></td>
          <td><input type="number" min="1" aria-label="Quantity" class="quotation-item-input"></td>
          <td><input type="number" min="0" step="0.01" aria-label="Actual Price" class="quotation-item-input"></td>
          <td><input type="number" min="0" step="0.01" aria-label="Price" class="quotation-item-input"></td>
          <td><button type="button" class="quotation-row-delete" aria-label="Delete row" title="Delete row">×</button></td>`;
        tr.querySelector('.quotation-row-delete').addEventListener('click', () => {
          tr.remove();
          updateRowNumbers();
        });
        rows.appendChild(tr);
        updateRowNumbers();
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.textContent = '';
        message.classList.remove('error');
        const items = [...rows.querySelectorAll('tr')].map(row => {
          const inputs = row.querySelectorAll('input');
          return {
            description: inputs[0].value.trim(),
            hsnCode: inputs[1].value.trim(),
            quantity: Number(inputs[2].value),
            actualPrice: Number(inputs[3].value),
            price: Number(inputs[4].value)
          };
        });
        const payload = {
          invoiceNo: document.getElementById('quotationInvoiceNo').value,
          date: document.getElementById('quotationDate').value,
          attention: document.getElementById('quotationAttention').value.trim(),
          clientName: document.getElementById('quotationClientName').value.trim(),
          companyName: document.getElementById('quotationCompanyName').value.trim(),
          isCode: document.getElementById('quotationIsCode').value.trim(),
          items
        };
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
        const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        submit.disabled = true;
        submit.textContent = 'Saving…';
        try {
          const response = await fetch('/api/lab-equipment/quotations', {
            method: 'POST', headers, credentials: 'same-origin', body: JSON.stringify(payload)
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.detail || data.message || 'Unable to save quotation.');
          message.textContent = `${data.message} (${data.invoiceNo})`;
          window.setTimeout(() => window.location.assign('/lab-equipment/quotation'), 800);
        } catch (error) {
          message.textContent = error.message;
          message.classList.add('error');
          submit.disabled = false;
          submit.textContent = 'Submit';
        }
      });
    })();
  </script>
</body>
</html>
