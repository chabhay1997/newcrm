<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="${editMode} ? 'Edit Challan | EVTL CRM' : 'Create Challan | EVTL CRM'">Create Challan | EVTL CRM</title>
  <link rel="stylesheet" th:href="@{/css/output.css}">
  <th:block th:replace="~{fragments/styles :: layout-styles}"></th:block>
  <style>
    .challan-field-label { display:block; margin-bottom:.42rem; color:#172033; font-size:12px; font-weight:800; }
    .challan-field-label b { color:#EF4444; }
    .challan-field { width:100%; min-height:2.7rem; border:1px solid #D7DDF8; border-radius:.35rem; padding:.65rem .9rem; background:#fff; color:#172033; font-size:12px; outline:none; }
    .challan-field:focus { border-color:#6475F2; box-shadow:0 0 0 3px rgba(100,117,242,.15); }
    .challan-field[readonly] { background:#E9ECF1; cursor:not-allowed; }
    textarea.challan-field { min-height:4rem; resize:vertical; }
    .challan-submit {
      display:flex; align-items:center; justify-content:center;
      width:100%; height:46px; border:0; border-radius:0;
      background:#6475F2 !important; color:#FFFFFF !important;
      font-size:12px; font-weight:800; cursor:pointer;
      transition:background .15s ease, box-shadow .15s ease;
    }
    .challan-submit:hover { background:#5565E6 !important; }
    .challan-submit:focus-visible { outline:3px solid #C7D2FE; outline-offset:2px; }
  </style>
</head>
<body>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="min-h-screen flex flex-col pl-[6.5rem]">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <main class="flex-1 px-8 pb-8">
      <div class="mb-4 flex items-end justify-between gap-4">
        <div><p class="mb-2 text-[11px] font-semibold text-[#6B87A8]">Workspace <span>/</span> Challan <span>/</span> <span th:text="${editMode} ? 'Edit' : 'Create'">Create</span></p><h1 class="text-[25px] font-extrabold leading-none text-[#17324F]" th:text="${editMode} ? 'Edit Challan' : 'Create Challan'">Create Challan</h1></div>
        <a href="/challan" class="rounded-lg border border-[#D9E1EE] bg-white px-4 py-2.5 text-[12px] font-bold text-[#3A4B63] hover:bg-[#F8FAFC]">Back to Challans</a>
      </div>

      <section class="overflow-hidden rounded-xl border border-[#D7DDF8] border-t-[7px] border-t-[#6475F2] bg-white shadow-[0_12px_32px_-24px_rgba(23,50,79,.42)]">
        <div th:if="${errorMessage}" class="mx-5 mt-5 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-[12px] font-semibold text-rose-700" th:text="${errorMessage}"></div>
        <div id="challanApiError" class="mx-5 mt-5 hidden rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-[12px] font-semibold text-rose-700" role="alert"></div>
        <form id="challanCreateForm" th:action="${editMode} ? @{/challan/{id}/edit(id=${challanId})} : @{/challan/create}" th:object="${challanForm}" method="post" enctype="multipart/form-data" th:attr="data-edit-mode=${editMode},data-challan-id=${challanId}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="grid grid-cols-1 gap-x-7 gap-y-2 p-5 lg:grid-cols-2">
            <div><label class="challan-field-label">Challan No. <b>*</b></label><input th:field="*{challanNo}" readonly class="challan-field"></div>
            <div><label class="challan-field-label">Client Name <b>*</b></label><input th:field="*{clientName}" maxlength="255" required placeholder="Client Name" class="challan-field"></div>
            <div><label class="challan-field-label">Client Number</label><input th:field="*{clientNumber}" maxlength="15" inputmode="tel" placeholder="Client Number" class="challan-field"></div>
            <div><label class="challan-field-label">Item Name <b>*</b></label><input th:field="*{itemName}" maxlength="255" required placeholder="Item Name" class="challan-field"></div>
            <div><label class="challan-field-label">Brand Name</label><input th:field="*{brandName}" maxlength="255" placeholder="Brand Name" class="challan-field"></div>
            <div><label class="challan-field-label">State Name</label><select th:field="*{stateId}" class="challan-field"><option value="">-- Select --</option><option th:each="state : ${states}" th:value="${state.id}" th:text="${state.name}"></option></select></div>
            <div><label class="challan-field-label">Quantity</label><input th:field="*{qty}" maxlength="255" placeholder="Enter Quantity" class="challan-field"></div>
            <div><label class="challan-field-label">Amount</label><input id="challanAmount" th:field="*{amount}" type="number" min="0" max="999999999999999999" step="0.01" placeholder="Enter Amount" class="challan-field"></div>
            <div><label class="challan-field-label">GST (%)</label><input id="challanGst" th:field="*{gst}" type="number" min="0" max="100" step="0.01" placeholder="Enter GST %" class="challan-field"></div>
            <div><label class="challan-field-label">Total Amount</label><input id="challanTotal" th:field="*{totalAmount}" readonly placeholder="Total Amount" class="challan-field"></div>
            <div><label class="challan-field-label">Date <b>*</b></label><input th:field="*{date}" type="date" required class="challan-field"></div>
            <div><label class="challan-field-label">Sample Return Date</label><input th:field="*{sampleReturnDate}" type="date" class="challan-field"></div>
            <div><label class="challan-field-label">Upload (Multiple)</label><input name="uploads" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" class="challan-field pt-2"><p class="mt-1 text-[10px] text-[#6B87A8]">Up to 5 PDF, JPG, JPEG, or PNG files; maximum 5 MB each.</p></div>
            <div><label class="challan-field-label">Address</label><textarea th:field="*{address}" maxlength="10000" class="challan-field"></textarea></div>
            <div><label class="challan-field-label">Pincode</label><input th:field="*{pincode}" maxlength="15" inputmode="numeric" class="challan-field"></div>
            <div><label class="challan-field-label">Remark</label><textarea th:field="*{remark}" maxlength="10000" class="challan-field"></textarea></div>
          </div>
          <button id="challanSubmit" type="submit" class="challan-submit" th:text="${editMode} ? 'Update Challan' : 'Submit Challan'">Submit Challan</button>
        </form>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const amount = document.getElementById('challanAmount');
      const gst = document.getElementById('challanGst');
      const total = document.getElementById('challanTotal');
      const form = document.getElementById('challanCreateForm');
      const submit = document.getElementById('challanSubmit');
      const apiError = document.getElementById('challanApiError');
      const editMode = form.dataset.editMode === 'true';
      const challanId = form.dataset.challanId;
      const idleLabel = editMode ? 'Update Challan' : 'Submit Challan';
      function calculateTotal() {
        const amountValue = Number.parseFloat(amount.value) || 0;
        const gstValue = Number.parseFloat(gst.value) || 0;
        total.value = (amountValue * (1 + gstValue / 100)).toFixed(2);
      }
      amount.addEventListener('input', calculateTotal);
      gst.addEventListener('input', calculateTotal);
      calculateTotal();
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        apiError.classList.add('hidden');
        submit.disabled = true;
        submit.textContent = editMode ? 'Updating...' : 'Submitting...';
        try {
          const csrfToken = document.querySelector('meta[name="_csrf"]').content;
          const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
          const response = await fetch(editMode ? `/api/challans/${encodeURIComponent(challanId)}` : '/api/challans', {
            method: editMode ? 'PUT' : 'POST', credentials: 'same-origin',
            headers: { [csrfHeader]: csrfToken, Accept: 'application/json' },
            body: new FormData(form)
          });
          if (response.status === 401) { window.location.assign('/login'); return; }
          if (!response.ok) {
            const problem = await response.json().catch(() => ({}));
            throw new Error(problem.detail || (editMode ? 'Unable to update challan.' : 'Unable to create challan.'));
          }
          const result = await response.json();
          window.location.assign(`/challan?page=${encodeURIComponent(result.dashboardPage)}`);
        } catch (error) {
          apiError.textContent = error.message || 'Unable to create challan. Please try again.';
          apiError.classList.remove('hidden');
          apiError.scrollIntoView({ behavior: 'smooth', block: 'center' });
          submit.disabled = false;
          submit.textContent = idleLabel;
        }
      });
    })();
  </script>
</body>
</html>
